<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A log scale of magnetic field strength from 10 microtesla to 10 tesla: Earth's field at 31 to 58 microtesla, a fridge magnet at 1 to 10 millitesla, a small neodymium magnet near 0.1 tesla, a loudspeaker's magnet gap at 1 to 2.4 tesla, and an MRI scanner at 1.5 to 7 tesla.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="790" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Magnetic field strength, in tesla (T), log scale</text>
<rect x="50" y="160" width="720" height="28" rx="14" fill="#3182ce" fill-opacity="0.4"/>
<rect x="50" y="160" width="720" height="28" rx="14" fill="url(#gloss)" stroke="#e2e8f0" stroke-opacity="0.35"/>
<line x1="50.0" y1="188" x2="50.0" y2="194" stroke="#a0aec0"/>
<text x="50.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 µT</text>
<line x1="170.0" y1="188" x2="170.0" y2="194" stroke="#a0aec0"/>
<text x="170.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 µT</text>
<line x1="290.0" y1="188" x2="290.0" y2="194" stroke="#a0aec0"/>
<text x="290.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">1 mT</text>
<line x1="410.0" y1="188" x2="410.0" y2="194" stroke="#a0aec0"/>
<text x="410.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 mT</text>
<line x1="530.0" y1="188" x2="530.0" y2="194" stroke="#a0aec0"/>
<text x="530.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">0.1 T</text>
<line x1="650.0" y1="188" x2="650.0" y2="194" stroke="#a0aec0"/>
<text x="650.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">1 T</text>
<line x1="770.0" y1="188" x2="770.0" y2="194" stroke="#a0aec0"/>
<text x="770.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 T</text>
<rect x="109.0" y="167" width="32.6" height="14" rx="7" fill="url(#eball)"/>
<line x1="125.3" y1="158" x2="125.3" y2="136" stroke="#a0aec0"/>
<text x="125.3" y="114.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Earth</text>
<text x="125.3" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">31–58 µT</text>
<rect x="290.0" y="167" width="120.0" height="14" rx="7" fill="url(#eball)"/>
<line x1="350.0" y1="216" x2="350.0" y2="236" stroke="#a0aec0"/>
<text x="350.0" y="250.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">fridge magnet</text>
<text x="350.0" y="266.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">1–10 mT</text>
<circle cx="530.0" cy="174.0" r="8" fill="url(#eball)"/>
<line x1="530.0" y1="158" x2="530.0" y2="136" stroke="#a0aec0"/>
<text x="530.0" y="114.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">small neodymium</text>
<text x="530.0" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">≈ 0.1 T</text>
<rect x="650.0" y="167" width="45.6" height="14" rx="7" fill="url(#eball)"/>
<line x1="672.8" y1="216" x2="672.8" y2="236" stroke="#a0aec0"/>
<text x="672.8" y="250.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">loudspeaker gap</text>
<text x="672.8" y="266.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">1–2.4 T</text>
<rect x="671.1" y="167" width="80.3" height="14" rx="7" fill="url(#eball)"/>
<line x1="711.3" y1="158" x2="711.3" y2="136" stroke="#a0aec0"/>
<text x="711.3" y="114.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">MRI scanner</text>
<text x="711.3" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">1.5–7 T</text>
</svg>
