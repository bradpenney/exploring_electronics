<text x="435.0" y="247.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>
<text x="400.0" y="405.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">lines never cross · they form closed loops · closer lines mean a stronger field</text>
<text x="120.0" y="120.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="normal">strongest near the poles,</text>
<text x="120.0" y="136.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="normal">where the lines crowd together</text>
