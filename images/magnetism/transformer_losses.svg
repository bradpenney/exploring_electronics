<text x="777.0" y="280.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">other winding</text>
<text x="450.0" y="348.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Together they're small in a good transformer: distribution transformers run 98 to 99% efficient.</text>
<text x="450.0" y="370.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Laminations, thin insulated sheets, cut eddy currents; a toroidal core keeps leakage low.</text>
