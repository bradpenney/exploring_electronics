<text x="597.0" y="360.0" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="bold">R = V² ÷ P = 144 Ω</text>
<text x="597.0" y="470.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">filament glowing at about 2,800 K</text>
