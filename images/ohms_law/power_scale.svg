<text x="186.7" y="266.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">148 mW</text>
<circle cx="400.0" cy="174.0" r="8" fill="url(#eball)"/>
<line x1="400.0" y1="158" x2="400.0" y2="136" stroke="#a0aec0"/>
<text x="400.0" y="114.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">phone charger</text>
<text x="400.0" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">10 W</text>
<circle cx="494.8" cy="174.0" r="8" fill="url(#eball)"/>
