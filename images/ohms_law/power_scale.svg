<line x1="123.2" y1="158" x2="123.2" y2="136" stroke="#a0aec0"/>
<text x="123.2" y="114.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">LED</text>
<text x="123.2" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">42 mW</text>
