<text x="516.7" y="130.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">100 W</text>
<circle cx="653.9" cy="174.0" r="8" fill="url(#eball)"/>
<line x1="653.9" y1="216" x2="653.9" y2="236" stroke="#a0aec0"/>
<text x="653.9" y="250.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">space heater</text>
<text x="653.9" y="266.0" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="normal">1500 W</text>
