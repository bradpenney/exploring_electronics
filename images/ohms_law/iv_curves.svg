<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Current against voltage for three parts. A resistor's line is perfectly straight. A lamp's curve bends over as the filament heats and its resistance climbs. An LED's curve stays flat near zero until about 1.8 volts, then rises almost vertically.</title>
