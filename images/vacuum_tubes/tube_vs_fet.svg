<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A comparison of a triode and a field-effect transistor. The cathode matches the source, which emits the carriers; the grid matches the gate, which controls by voltage; the plate matches the drain, which collects the output. Beneath the triode: its heater uses 1.9 watts before any signal, and its plate runs up to 300 volts. Beneath the FET: no heater, and logic-level parts run from a few volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">A triode and a field-effect transistor do the same job</text>
<rect x="165.0" y="98.0" width="170" height="44" rx="22.0" fill="#c05621"/>
<rect x="165.0" y="98.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="250.0" y="125.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">cathode</text>
<rect x="565.0" y="98.0" width="170" height="44" rx="22.0" fill="#4299e1"/>
<rect x="565.0" y="98.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="650.0" y="125.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">source</text>
<line x1="345" y1="120" x2="555" y2="120" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450.0" y="112.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">emits the carriers</text>
<rect x="165.0" y="178.0" width="170" height="44" rx="22.0" fill="#c05621"/>
<rect x="165.0" y="178.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="250.0" y="205.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">grid</text>
<rect x="565.0" y="178.0" width="170" height="44" rx="22.0" fill="#4299e1"/>
<rect x="565.0" y="178.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="650.0" y="205.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">gate</text>
<line x1="345" y1="200" x2="555" y2="200" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450.0" y="192.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">controls by voltage</text>
<rect x="165.0" y="258.0" width="170" height="44" rx="22.0" fill="#c05621"/>
<rect x="165.0" y="258.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="250.0" y="285.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">plate</text>
<rect x="565.0" y="258.0" width="170" height="44" rx="22.0" fill="#4299e1"/>
<rect x="565.0" y="258.0" width="170" height="44" rx="22.0" fill="url(#gloss)"/>
<text x="650.0" y="285.8" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">drain</text>
<line x1="345" y1="280" x2="555" y2="280" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450.0" y="272.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">collects the output</text>
<text x="250.0" y="365.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">heater: 1.9 W before any signal (12AX7)</text>
<text x="250.0" y="385.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">plate: up to 300 V</text>
<text x="650.0" y="365.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">no heater; works the moment power arrives</text>
<text x="650.0" y="385.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">logic-level parts run from a few volts</text>
<text x="250.0" y="80.0" font-size="14" fill="#f6ad55" text-anchor="middle" font-weight="bold">TRIODE</text>
<text x="650.0" y="80.0" font-size="14" fill="#90cdf4" text-anchor="middle" font-weight="bold">FET</text>
</svg>
