<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels of a triode with the plate positive at the top, the hot cathode at the bottom, and a row of grid wires between. With the grid slightly negative, some electrons pass through the gaps to the plate. More negative, fewer pass. Far enough negative, none pass and the tube is cut off.</title>
