<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A 3D triode inside a glass envelope with the air pumped out. In the centre, a glowing orange cathode sleeve with a heater inside it boils off electrons. Around it, a fine wire helix forms the grid. Outside that, two metal plate walls collect the electrons crossing the vacuum. Pins at the base connect the heater, cathode, grid and plate.</title>
