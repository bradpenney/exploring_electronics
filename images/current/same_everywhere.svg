<text x="400.0" y="374.7" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">21 mA</text>
<text x="400.0" y="410.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">every meter reads the same: no charge is used up</text>
<text x="400.0" y="432.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the balls dim as they pass the resistor and the LED: that's energy (voltage) being spent</text>
