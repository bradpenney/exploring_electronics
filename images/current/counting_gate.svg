/linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0" stop-opacity="0.35"/><stop offset="0.3" stop-color="#e2e8f0" stop-opacity="0.05"/><stop offset="0.85" stop-color="#1a202c" stop-opacity="0.25"/><stop offset="1" stop-color="#e2e8f0" stop-opacity="0.3"/></linearGradient><radialGradient id="midball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fde8c0"/><stop offset="0.45" stop-color="#b7791f"/><stop offset="1" stop-color="#4a2c0a"/></radialGradient><radialGradient id="lowball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient></defs>
