<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A glass wire full of electrons flowing past a glowing ring that marks one counting point. A counter reads 1.25 times 10 to the 17 electrons per second, which is 0.020 coulombs per second, or 20 milliamps.</title>
