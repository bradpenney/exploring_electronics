<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two panels. Left: measuring voltage, a meter's probes touch either side of a resistor and it reads 7.0 volts while the circuit stays whole. Right: measuring current, the wire is cut and the meter's probes bridge the gap so all the current flows through the meter, which reads 21.2 milliamps.</title>
