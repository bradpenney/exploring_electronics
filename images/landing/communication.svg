<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" style="max-width:100%;height:auto" role="group" aria-labelledby="cm-title cm-desc" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title id="cm-title">Communication reading order, as a transit map</title>
<desc id="cm-desc">One line through three stops. Point to point: Serial; Shared buses: I²C, SPI. Every stop is a link to its article.</desc>
<style>.tm-stop .tm-ring{stroke:#1a202c;stroke-width:3;transition:stroke .15s}.tm-stop:hover .tm-ring,.tm-stop:focus-visible .tm-ring{stroke:#ffffff;stroke-width:4}.tm-stop:hover .tm-lbl,.tm-stop:focus-visible .tm-lbl{fill:#ffffff;text-decoration:underline}.tm-stop:focus{outline:none}</style>
<defs>
<linearGradient id="cm-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient>
<radialGradient id="cm-ball-38b2ac" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#afe0dd"/><stop offset="0.45" stop-color="#38b2ac"/><stop offset="1" stop-color="#19504d"/></radialGradient>
<radialGradient id="cm-ball-f59e0b" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fbd89d"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#6e4704"/></radialGradient>
</defs>
<rect x="15" y="15" width="970" height="180" rx="14" fill="url(#cm-panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="500.0" y="46.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Click any stop to open its article</text>
<path d="M112.0,120 L272.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000000" stroke-opacity="0.45" stroke-width="12" transform="translate(2,4)"/>
<path d="M112.0,120 L272.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#f59e0b" stroke-width="10"/>
<path d="M112.0,120 L272.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#face85" stroke-opacity="0.55" stroke-width="3" transform="translate(-1,-2)"/>
<path d="M272.0,120 L432.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000000" stroke-opacity="0.45" stroke-width="12" transform="translate(2,4)"/>
<path d="M272.0,120 L432.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#38b2ac" stroke-width="10"/>
<path d="M272.0,120 L432.0,120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#9bd8d5" stroke-opacity="0.55" stroke-width="3" transform="translate(-1,-2)"/>
<text x="112.0" y="88.0" font-size="13" fill="#f7b648" text-anchor="middle" font-weight="bold">Point to point</text>
<text x="352.0" y="88.0" font-size="13" fill="#69c5c0" text-anchor="middle" font-weight="bold">Shared buses</text>
<a class="tm-stop" href="../serial_communication/" aria-label="1. Serial">
<title>1. Serial</title>
<circle cx="114.0" cy="124" r="15" fill="#000000" fill-opacity="0.4"/>
<circle class="tm-ring" cx="112.0" cy="120" r="15" fill="url(#cm-ball-f59e0b)"/>
<text x="112.0" y="125" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1</text>
<text class="tm-lbl" x="112.0" y="158" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Serial</text>
</a>
<a class="tm-stop" href="../i2c/" aria-label="2. I²C">
<title>2. I²C</title>
<circle cx="274.0" cy="124" r="15" fill="#000000" fill-opacity="0.4"/>
<circle class="tm-ring" cx="272.0" cy="120" r="15" fill="url(#cm-ball-38b2ac)"/>
<text x="272.0" y="125" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text class="tm-lbl" x="272.0" y="158" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">I²C</text>
</a>
<a class="tm-stop" href="../spi/" aria-label="3. SPI">
<title>3. SPI</title>
<circle cx="434.0" cy="124" r="15" fill="#000000" fill-opacity="0.4"/>
<circle class="tm-ring" cx="432.0" cy="120" r="15" fill="url(#cm-ball-38b2ac)"/>
<text x="432.0" y="125" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text class="tm-lbl" x="432.0" y="158" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">SPI</text>
</a>
</svg>
