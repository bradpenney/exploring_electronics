<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two voltmeters on a live 120 volt wire. With both probes on the wire, the meter reads 0 volts. With one probe on the wire and one on ground, it reads 120 volts.</title>
