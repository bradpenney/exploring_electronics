<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two blocks of land: hilltop A at 300 metres and valley B at 100 metres above sea level. Measured from B instead, A is 200 metres and B is 0. In a circuit, rails at 5 volts and 3.3 volts are measured from ground at 0 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="770" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Zero is a choice: only the difference is real</text>
<ellipse cx="166.0" cy="345.0" rx="102.0" ry="10.8" fill="#000" fill-opacity="0.4"/>
<polygon points="70.0,120.0 220.0,120.0 262.0,93.0 112.0,93.0" fill="#808895"/>
<rect x="70.0" y="120.0" width="150.0" height="220.0" fill="#4a5568"/>
<rect x="70.0" y="120.0" width="150.0" height="220.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="220.0,340.0 220.0,120.0 262.0,93.0 262.0,313.0" fill="#282e39"/>
<text x="145.0" y="80.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Hilltop A</text>
<ellipse cx="426.0" cy="345.0" rx="102.0" ry="10.8" fill="#000" fill-opacity="0.4"/>
<polygon points="330.0,220.0 480.0,220.0 522.0,193.0 372.0,193.0" fill="#808895"/>
<rect x="330.0" y="220.0" width="150.0" height="120.0" fill="#4a5568"/>
<rect x="330.0" y="220.0" width="150.0" height="120.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="480.0,340.0 480.0,220.0 522.0,193.0 522.0,313.0" fill="#282e39"/>
<text x="405.0" y="180.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Valley B</text>
<text x="145.0" y="270.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">300 m above sea</text>
<text x="145.0" y="290.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">+200 m above B</text>
<text x="405.0" y="270.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">100 m above sea</text>
<text x="405.0" y="290.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">0 m above B</text>
<text x="275.0" y="380.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">measured from sea level or from B, A is always 200 m higher</text>
<text x="650.0" y="100.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">In a circuit</text>
<rect x="565.0" y="133.0" width="170" height="34" rx="17.0" fill="#f59e0b"/>
<rect x="565.0" y="133.0" width="170" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="650.0" y="154.7" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">5 V rail</text>
<rect x="565.0" y="188.0" width="170" height="34" rx="17.0" fill="#d69e2e"/>
<rect x="565.0" y="188.0" width="170" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="650.0" y="209.7" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3.3 V rail</text>
<rect x="565.0" y="283.0" width="170" height="34" rx="17.0" fill="#4a5568"/>
<rect x="565.0" y="283.0" width="170" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="650.0" y="304.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">ground: 0 V</text>
<text x="650.0" y="340.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">“5 V on this pin” means</text>
<text x="650.0" y="356.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">5 V above ground</text>
</svg>
