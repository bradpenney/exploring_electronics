/linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="cell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#68717c"/><stop offset="0.22" stop-color="#cad2dc"/><stop offset="0.5" stop-color="#a0aec0"/><stop offset="1" stop-color="#40454c"/></linearGradient><linearGradient id="lead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#495361"/><stop offset="0.22" stop-color="#b0b9c5"/><stop offset="0.5" stop-color="#718096"/><stop offset="1" stop-color="#2d333c"/></linearGradient></defs>
