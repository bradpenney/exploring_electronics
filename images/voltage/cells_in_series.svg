<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two stacks of six cells. A 9 volt battery is six 1.5 volt cells adding up to 9 volts. A car battery is six roughly 2.1 volt cells adding up to about 12.6 volts.</title>
