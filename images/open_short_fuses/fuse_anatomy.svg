<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A glass cartridge fuse with a thin wavy metal element between two end caps, labelled with its three ratings: current, voltage, and speed. Beside it, a blue 15 amp car blade fuse, rated 32 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="glassf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0" stop-opacity="0.45"/><stop offset="0.35" stop-color="#e2e8f0" stop-opacity="0.08"/><stop offset="0.85" stop-color="#1a202c" stop-opacity="0.2"/><stop offset="1" stop-color="#e2e8f0" stop-opacity="0.35"/></linearGradient><linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#838a91"/><stop offset="0.22" stop-color="#e2e7ed"/><stop offset="0.5" stop-color="#cbd5e0"/><stop offset="1" stop-color="#515559"/></linearGradient><linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5485"/><stop offset="0.22" stop-color="#8dbae4"/><stop offset="0.5" stop-color="#3182ce"/><stop offset="1" stop-color="#133452"/></linearGradient></defs>
<rect x="15" y="15" width="770" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A fuse is a deliberate weak link, and it carries three ratings</text>
<ellipse cx="290.0" cy="194" rx="190.0" ry="7" fill="#000" fill-opacity="0.4"/>
<path d="M170,150 q24,-14 48,0 t48,0 t48,0 t48,0 t48,0" fill="none" stroke="#cbd5e0" stroke-width="2.5"/>
<rect x="160" y="120" width="260" height="60" fill="url(#glassf)"/>
<rect x="120" y="117" width="50" height="66" rx="6" fill="url(#cap)"/>
<rect x="410" y="117" width="50" height="66" rx="6" fill="url(#cap)"/>
<text x="290.0" y="214.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">thin metal element inside a glass tube</text>
<rect x="65.0" y="235.0" width="170" height="30" rx="15.0" fill="#2d3748"/>
<rect x="65.0" y="235.0" width="170" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="150.0" y="254.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Current rating</text>
<text x="250.0" y="248.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">the current it carries without melting;</text>
<text x="250.0" y="264.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">run it at no more than about 75% of this</text>
<rect x="65.0" y="285.0" width="170" height="30" rx="15.0" fill="#d97706"/>
<rect x="65.0" y="285.0" width="170" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="150.0" y="304.7" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Voltage rating</text>
<text x="250.0" y="298.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">the highest voltage it can safely break:</text>
<text x="250.0" y="314.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">32, 63, 125, 250, 600 V are standard</text>
<rect x="65.0" y="335.0" width="170" height="30" rx="15.0" fill="#2d3748"/>
<rect x="65.0" y="335.0" width="170" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="150.0" y="354.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Speed</text>
<text x="250.0" y="348.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">very fast-acting, fast-acting, or slow-blow</text>
<text x="250.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">(slow-blow rides through switch-on surges)</text>
<rect x="600" y="120" width="90" height="70" rx="10" fill="url(#blade)" opacity="0.9"/>
<text x="645.0" y="164.0" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">15</text>
<rect x="614" y="190" width="18" height="44" fill="url(#cap)"/>
<rect x="658" y="190" width="18" height="44" fill="url(#cap)"/>
<text x="645.0" y="260.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">car blade fuse:</text>
<text x="645.0" y="276.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">rated 32 V</text>
</svg>
