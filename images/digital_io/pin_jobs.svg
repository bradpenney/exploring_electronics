<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two panels. OUTPUT: pin 3, set HIGH at 5 volts, pushes current through a resistor and lights an LED. INPUT: pin 2 only listens, measuring the voltage a button holds it at while drawing almost no current.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="425" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="460" y="15" width="425" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="227.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">OUTPUT: the pin pushes current</text>
<ellipse cx="129.0" cy="305.0" rx="75.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="60.0,150.0 170.0,150.0 198.0,132.0 88.0,132.0" fill="#6c737e"/>
<rect x="60.0" y="150.0" width="110.0" height="150.0" fill="#2d3748"/>
<rect x="60.0" y="150.0" width="110.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="170.0,300.0 170.0,150.0 198.0,132.0 198.0,282.0" fill="#181e27"/>
<text x="115.0" y="200.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">pin 3</text>
<text x="115.0" y="220.0" font-size="12" fill="#48bb78" text-anchor="middle" font-weight="bold">HIGH = 5 V</text>
<path d="M190,210 L270,210" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="275" y="198" width="50" height="22" rx="9" fill="#d6b98c"/>
<text x="300.0" y="245.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">resistor</text>
<radialGradient id="led9253608" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.35" stop-color="#fc8181"/><stop offset="1" stop-color="#713a3a"/></radialGradient>
<circle cx="370" cy="209" r="51.2" fill="#fc8181" fill-opacity="0.18"/>
<circle cx="370" cy="209" r="32.0" fill="#fc8181" fill-opacity="0.22"/>
<line x1="364.4" y1="225" x2="364.4" y2="250.6" stroke="#a0aec0" stroke-width="2.4"/>
<line x1="375.6" y1="225" x2="375.6" y2="245.8" stroke="#a0aec0" stroke-width="2.4"/>
<rect x="351.6" y="217.8" width="36.8" height="8.0" rx="2" fill="url(#led9253608)"/>
<path d="M354.0,218.6 L354.0,209.0 A16,16 0 0 1 386.0,209.0 L386.0,218.6 Z" fill="url(#led9253608)"/>
<text x="370.0" y="268.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">LED lit</text>
<text x="227.0" y="345.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">current flows out of the pin,</text>
<text x="227.0" y="362.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">through the LED, to ground</text>
<text x="672.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">INPUT: the pin only listens</text>
<ellipse cx="574.0" cy="305.0" rx="75.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="505.0,150.0 615.0,150.0 643.0,132.0 533.0,132.0" fill="#6c737e"/>
<rect x="505.0" y="150.0" width="110.0" height="150.0" fill="#2d3748"/>
<rect x="505.0" y="150.0" width="110.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="615.0,300.0 615.0,150.0 643.0,132.0 643.0,282.0" fill="#181e27"/>
<text x="560.0" y="200.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">pin 2</text>
<text x="560.0" y="220.0" font-size="12" fill="#48bb78" text-anchor="middle" font-weight="bold">reads HIGH</text>
<path d="M760,210 L640,210" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="700.0" y="172.0" font-size="11" fill="#90cdf4" text-anchor="middle" font-weight="bold">voltage, almost no current</text>
<rect x="760" y="186" width="80" height="48" rx="8" fill="#4a5568"/>
<text x="800.0" y="215.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">button</text>
<text x="672.0" y="345.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">the pin measures the voltage</text>
<text x="672.0" y="362.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">something else holds it at</text>
</svg>
