<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A 3D column from 0 to 5 volts in three bands: below 1.5 volts reads LOW, above 3 volts reads HIGH, and the band between is not guaranteed. A supply sagging to 4.6 volts still reads HIGH, 0.3 volts of noise on a LOW still reads LOW, and 2.2 volts could read either way.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">What an Uno's input pin reads, by voltage</text>
<ellipse cx="377.5" cy="385.0" rx="83.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="300.0,290.0 420.0,290.0 455.0,267.5 335.0,267.5" fill="#6a98c7"/>
<rect x="300.0" y="290.0" width="120.0" height="90.0" fill="#2b6cb0"/>
<rect x="300.0" y="290.0" width="120.0" height="90.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="420.0,380.0 420.0,290.0 455.0,267.5 455.0,357.5" fill="#173b60"/>
<text x="360.0" y="340.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">LOW</text>
<polygon points="300.0,200.0 420.0,200.0 455.0,177.5 335.0,177.5" fill="#808895"/>
<rect x="300.0" y="200.0" width="120.0" height="90.0" fill="#4a5568"/>
<rect x="300.0" y="200.0" width="120.0" height="90.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="420.0,290.0 420.0,200.0 455.0,177.5 455.0,267.5" fill="#282e39"/>
<text x="360.0" y="250.0" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">not guaranteed</text>
<polygon points="300.0,80.0 420.0,80.0 455.0,57.5 335.0,57.5" fill="#7ecfa0"/>
<rect x="300.0" y="80.0" width="120.0" height="120.0" fill="#48bb78"/>
<rect x="300.0" y="80.0" width="120.0" height="120.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="420.0,200.0 420.0,80.0 455.0,57.5 455.0,177.5" fill="#276642"/>
<text x="360.0" y="145.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">HIGH</text>
<text x="286.0" y="384.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">0 V</text>
<text x="286.0" y="294.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">1.5 V</text>
<text x="286.0" y="204.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">3 V</text>
<text x="286.0" y="84.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">5 V</text>
<line x1="460" y1="104.0" x2="490" y2="104.0" stroke="#48bb78" stroke-width="3"/>
<circle cx="460" cy="104.0" r="5" fill="#48bb78"/>
<text x="498.0" y="109.0" font-size="13" fill="#48bb78" text-anchor="start" font-weight="bold">4.6 V (a sagging supply): still HIGH</text>
<line x1="460" y1="362.0" x2="490" y2="362.0" stroke="#90cdf4" stroke-width="3"/>
<circle cx="460" cy="362.0" r="5" fill="#90cdf4"/>
<text x="498.0" y="367.0" font-size="13" fill="#90cdf4" text-anchor="start" font-weight="bold">0.3 V of noise on a LOW: still LOW</text>
<line x1="460" y1="248.0" x2="490" y2="248.0" stroke="#fc8181" stroke-width="3"/>
<circle cx="460" cy="248.0" r="5" fill="#fc8181"/>
<text x="498.0" y="253.0" font-size="13" fill="#fc8181" text-anchor="start" font-weight="bold">2.2 V: could read either way</text>
<text x="140.0" y="200.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">above 3 V</text>
<text x="140.0" y="218.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">(60% of 5 V)</text>
<text x="140.0" y="320.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">below 1.5 V</text>
<text x="140.0" y="338.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">(30% of 5 V)</text>
</svg>
