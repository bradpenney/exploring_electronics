<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Power dissipated in the transistor against how far it is turned on. Off, it dissipates nothing. Fully on, about 44 milliwatts. Half on, with 6 volts across it and 75 milliamps through it, about 450 milliwatts, most of the P2N2222A's 625 milliwatt rating.</title>
