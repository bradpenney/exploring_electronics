<text x="215.0" y="330.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">P-type body blocks the path</text>
<text x="115.0" y="140.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">source</text>
<text x="225.0" y="122.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">gate (on oxide)</text>
<text x="325.0" y="140.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">drain</text>
<text x="225.0" y="382.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">no current flows into the gate: the oxide is an insulator</text>
