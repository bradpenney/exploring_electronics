<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Collector current against base current for an NPN transistor driving a 12 volt, 80 ohm fan. Near zero base current it is in cutoff. In the active region collector current rises at 150 times the base current. Above about 1 milliamp of base current it saturates at about 146 milliamps, limited by the load.</title>
