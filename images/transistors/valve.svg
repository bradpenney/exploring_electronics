<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A transistor as a valve. A thin amber pipe carrying 1 milliamp into the base opens a gate in a wide pipe, letting 150 milliamps flow from the collector down to the emitter: a current gain of 150.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="bigpipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303743"/><stop offset="0.22" stop-color="#9ba1ab"/><stop offset="0.5" stop-color="#4a5568"/><stop offset="1" stop-color="#1d2229"/></linearGradient><linearGradient id="smallpipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#764e14"/><stop offset="0.22" stop-color="#d7b583"/><stop offset="0.5" stop-color="#b7791f"/><stop offset="1" stop-color="#49300c"/></linearGradient></defs>
<rect x="15" y="15" width="830" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="430.0" y="48.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A small flow sets the size of a big one</text>
<rect x="380" y="80" width="70" height="290" rx="8" fill="url(#bigpipe)"/>
<line x1="415" y1="100" x2="415" y2="136" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="415" y1="154" x2="415" y2="190" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="415" y1="208" x2="415" y2="244" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="415" y1="262" x2="415" y2="298" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="415" y1="316" x2="415" y2="352" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<ellipse cx="429.0" cy="255.0" rx="80.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="355.0,200.0 475.0,200.0 503.0,182.0 383.0,182.0" fill="#6c737e"/>
<rect x="355.0" y="200.0" width="120.0" height="50.0" fill="#2d3748"/>
<rect x="355.0" y="200.0" width="120.0" height="50.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="475.0,250.0 475.0,200.0 503.0,182.0 503.0,232.0" fill="#181e27"/>
<text x="415.0" y="232.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">gate</text>
<rect x="150" y="214" width="205" height="18" rx="6" fill="url(#smallpipe)"/>
<line x1="170" y1="223" x2="330" y2="223" stroke="#fff7e0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150.0" y="200.0" font-size="14" fill="#fbbf24" text-anchor="start" font-weight="bold">base: 1 mA</text>
<text x="480.0" y="100.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="bold">collector</text>
<text x="480.0" y="118.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal">(from the load)</text>
<text x="480.0" y="350.0" font-size="14" fill="#90cdf4" text-anchor="start" font-weight="bold">emitter: 150 mA</text>
<text x="480.0" y="368.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal">(to ground)</text>
<text x="650.0" y="220.0" font-size="34" fill="#fbbf24" text-anchor="middle" font-weight="bold">×150</text>
<text x="650.0" y="246.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">current gain</text>
</svg>
