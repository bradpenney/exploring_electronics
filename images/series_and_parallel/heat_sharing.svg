<text x="609.0" y="120.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1.44 W</text>
<text x="609.0" y="138.0" font-size="11" fill="#fca6a6" text-anchor="middle" font-weight="normal">576% of rating, burns</text>
<path d="M558,178.0 l84,-10 M558,188.0 l84,-10" stroke="#1a202c" stroke-width="5"/>
<text x="597.0" y="410.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 Ω</text>
<ellipse cx="739.6" cy="385.0" rx="53.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="692.0,264.8 762.0,264.8 787.2,248.6 717.2,248.6" fill="#f8bb54"/>
<rect x="692.0" y="264.8" width="70.0" height="115.2" fill="#f59e0b"/>
<rect x="692.0" y="264.8" width="70.0" height="115.2" fill="url(#gloss)" opacity="0.6"/>
<polygon points="762.0,380.0 762.0,264.8 787.2,248.6 787.2,363.8" fill="#865606"/>
<text x="739.0" y="220.8" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">144 mW</text>
<text x="739.0" y="238.8" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="normal">58% of rating</text>
<text x="727.0" y="410.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1 kΩ</text>
</svg>
