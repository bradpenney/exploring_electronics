<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Left, a 9 volt battery with two 10 kilohm resistors in series and the output taken between them. Right, the same thing as the output sees it: a 4.5 volt cell behind a single 5 kilohm resistor, which is R1 and R2 in parallel. Adding a 1 kilohm load gives 4.5 volts times 1 over 6, or 0.75 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="vd-bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9f6607"/><stop offset="0.22" stop-color="#f9c978"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#623f04"/></linearGradient><linearGradient id="vd-res" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b785b"/><stop offset="0.22" stop-color="#e8d8bf"/><stop offset="0.5" stop-color="#d6b98c"/><stop offset="1" stop-color="#554a38"/></linearGradient><linearGradient id="vd-resv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b785b"/><stop offset="0.22" stop-color="#e8d8bf"/><stop offset="0.5" stop-color="#d6b98c"/><stop offset="1" stop-color="#554a38"/></linearGradient></defs>
<rect x="15" y="15" width="400" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="485" y="15" width="400" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="215.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">The divider</text>
<text x="685.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">What its output sees</text>
<rect x="70" y="150" width="44" height="150" rx="6" fill="url(#vd-bat)"/>
<ellipse cx="92" cy="150" rx="22" ry="6" fill="#f8bb54"/>
<rect x="85" y="140" width="14" height="8" rx="2" fill="#cbd5e0"/>
<text x="92.0" y="230.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">9 V</text>
<path d="M92,140 L92,110 L230,110 L230,130" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="219" y="130" width="22" height="70" rx="10" fill="url(#vd-resv)"/>
<rect x="219" y="151.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="219" y="161.5" width="22" height="5" fill="#5a3a1a"/>
<rect x="219" y="172.0" width="22" height="5" fill="#5a3a1a"/>
<text x="250.0" y="170.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="bold">R1 10 kΩ</text>
<path d="M230,200 L230,225" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="219" y="225" width="22" height="70" rx="10" fill="url(#vd-resv)"/>
<rect x="219" y="246.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="219" y="256.5" width="22" height="5" fill="#5a3a1a"/>
<rect x="219" y="267.0" width="22" height="5" fill="#5a3a1a"/>
<text x="250.0" y="265.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="bold">R2 10 kΩ</text>
<path d="M230,295 L230,340 L92,340 L92,300" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<path d="M230,212 L360,212" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<circle cx="365" cy="212" r="6" fill="#48bb78"/>
<path d="M230,340 L360,340" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<circle cx="365" cy="340" r="6" fill="#a0aec0"/>
<text x="365.0" y="196.0" font-size="13" fill="#48bb78" text-anchor="middle" font-weight="bold">out</text>
<text x="365.0" y="368.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">0 V</text>
<text x="450.0" y="240.0" font-size="44" fill="#fbbf24" text-anchor="middle" font-weight="bold">=</text>
<rect x="560" y="180" width="44" height="120" rx="6" fill="url(#vd-bat)"/>
<ellipse cx="582" cy="180" rx="22" ry="6" fill="#f8bb54"/>
<rect x="575" y="170" width="14" height="8" rx="2" fill="#cbd5e0"/>
<text x="582.0" y="245.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4.5 V</text>
<path d="M582,170 L582,150 L650,150" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="650" y="139" width="90" height="22" rx="10" fill="url(#vd-res)"/>
<rect x="677.0" y="139" width="5" height="22" fill="#5a3a1a"/>
<rect x="690.5" y="139" width="5" height="22" fill="#5a3a1a"/>
<rect x="704.0" y="139" width="5" height="22" fill="#5a3a1a"/>
<text x="695.0" y="130.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5 kΩ</text>
<path d="M740,150 L830,150" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<circle cx="835" cy="150" r="6" fill="#48bb78"/>
<path d="M582,300 L582,340 L830,340" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<circle cx="835" cy="340" r="6" fill="#a0aec0"/>
<text x="835.0" y="134.0" font-size="13" fill="#48bb78" text-anchor="middle" font-weight="bold">out</text>
<text x="835.0" y="368.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">0 V</text>
<text x="700.0" y="230.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">4.5 V = the unloaded output</text>
<text x="700.0" y="250.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">5 kΩ = R1 and R2 in parallel</text>
<text x="700.0" y="400.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">add a 1 kΩ load: 4.5 V × 1 ÷ (5 + 1) = 0.75 V</text>
</svg>
