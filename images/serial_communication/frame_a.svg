<text x="228.3" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1</text>
<text x="228.3" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 0</text>
<rect x="262.0" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="291.7" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="291.7" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 1</text>
<rect x="325.3" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="355.0" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="355.0" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 2</text>
<rect x="388.7" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="418.3" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="418.3" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 3</text>
<rect x="452.0" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="481.7" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="481.7" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 4</text>
<rect x="515.3" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="545.0" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="545.0" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 5</text>
<rect x="578.7" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="608.3" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1</text>
<text x="608.3" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 6</text>
<rect x="642.0" y="110" width="59.3" height="22" rx="5" fill="#f59e0b" fill-opacity="0.25"/>
<text x="671.7" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="671.7" y="276.0" font-size="11" fill="#f8bb54" text-anchor="middle" font-weight="bold">bit 7</text>
<rect x="705.3" y="110" width="59.3" height="22" rx="5" fill="#48bb78" fill-opacity="0.25"/>
<text x="735.0" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1</text>
<text x="735.0" y="276.0" font-size="11" fill="#7ecfa0" text-anchor="middle" font-weight="bold">stop</text>
<text x="101.7" y="126.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">idle</text>
<text x="798.3" y="126.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">idle</text>
<path d="M133.3,300 l63.3,0" stroke="#a0aec0" stroke-width="2"/>
<text x="165.0" y="318.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">104 µs</text>
<text x="450.0" y="365.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">least significant bit first: 1, 0, 0, 0, 0, 0, 1, 0 is 01000001 read backwards</text>
<text x="450.0" y="385.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">10 bits per character: 1.04 ms each, 960 characters a second</text>
</svg>
