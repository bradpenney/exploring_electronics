<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A 3D bar chart of one alkaline AA cell's capacity at four currents: about 3,000 milliamp-hours at 25 milliamps, 2,500 at 100, 2,000 at 250, and 1,500 at 500, so heavier loads both drain it faster and get less total charge out of it.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="770" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">One alkaline AA, four loads: drain it faster and it delivers less</text>
<polygon points="110.0,95.0 200.0,95.0 221.0,81.5 131.0,81.5" fill="#f8bb54"/>
<rect x="110.0" y="95.0" width="90.0" height="225.0" fill="#f59e0b"/>
<rect x="110.0" y="95.0" width="90.0" height="225.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="200.0,320.0 200.0,95.0 221.0,81.5 221.0,306.5" fill="#865606"/>
<text x="155.0" y="73.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">~3,000 mAh</text>
<text x="155.0" y="344.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">at 25 mA</text>
<text x="155.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">~120 hours</text>
<polygon points="270.0,132.5 360.0,132.5 381.0,119.0 291.0,119.0" fill="#deaa52"/>
<rect x="270.0" y="132.5" width="90.0" height="187.5" fill="#d08609"/>
<rect x="270.0" y="132.5" width="90.0" height="187.5" fill="url(#gloss)" opacity="0.6"/>
<polygon points="360.0,320.0 360.0,132.5 381.0,119.0 381.0,306.5" fill="#724904"/>
<text x="315.0" y="110.5" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">~2,500 mAh</text>
<text x="315.0" y="344.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">at 100 mA</text>
<text x="315.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">~25 hours</text>
<polygon points="430.0,170.0 520.0,170.0 541.0,156.5 451.0,156.5" fill="#c49951"/>
<rect x="430.0" y="170.0" width="90.0" height="150.0" fill="#ab6e07"/>
<rect x="430.0" y="170.0" width="90.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="520.0,320.0 520.0,170.0 541.0,156.5 541.0,306.5" fill="#5e3c03"/>
<text x="475.0" y="148.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">~2,000 mAh</text>
<text x="475.0" y="344.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">at 250 mA</text>
<text x="475.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">~8 hours</text>
<polygon points="590.0,207.5 680.0,207.5 701.0,194.0 611.0,194.0" fill="#aa8850"/>
<rect x="590.0" y="207.5" width="90.0" height="112.5" fill="#865606"/>
<rect x="590.0" y="207.5" width="90.0" height="112.5" fill="url(#gloss)" opacity="0.6"/>
<polygon points="680.0,320.0 680.0,207.5 701.0,194.0 701.0,306.5" fill="#492f03"/>
<text x="635.0" y="185.5" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">~1,500 mAh</text>
<text x="635.0" y="344.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">at 500 mA</text>
<text x="635.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">~3 hours</text>
<text x="400.0" y="384.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">approximate values read from the Energizer E91 datasheet's capacity chart</text>
</svg>
