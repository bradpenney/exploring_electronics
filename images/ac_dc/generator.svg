<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>An elementary generator: a copper loop turns between a north and a south magnet pole, with slip rings and brushes carrying the current out. Beside it, one cycle of the sine wave it produces, marked at 0, 90, 180, 270 and 360 degrees of rotation: zero, maximum, zero, maximum reversed, and zero.</title>
