<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Left: one cycle of a sine wave peaking at 170 volts, its square in amber (always positive), and a dashed line at 120 volts RMS, 0.707 times the peak. Right: two identical heaters, one on 120 volts DC and one on 120 volts RMS AC, glowing equally.</title>
