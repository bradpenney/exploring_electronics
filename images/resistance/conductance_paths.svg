<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two parallel paths drawn as pipes whose width shows conductance: a 100 ohm path of 10 millisiemens and a thinner 220 ohm path of 4.5 millisiemens. Together they conduct 14.5 millisiemens, which is 68.8 ohms, less than either path alone.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4672"/><stop offset="0.22" stop-color="#8aaed3"/><stop offset="0.5" stop-color="#2b6cb0"/><stop offset="1" stop-color="#112b46"/></linearGradient></defs>
<rect x="15" y="15" width="770" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Conductance: how easily current flows. Side-by-side paths simply add.</text>
<path d="M110,220 C190,220 200,150 280,150 L520,150 C600,150 610,220 690,220" fill="none" stroke="#90cdf4" stroke-opacity="0.18" stroke-width="50.0"/>
<path d="M110,220 C190,220 200,150 280,150 L520,150 C600,150 610,220 690,220" fill="none" stroke="#3182ce" stroke-width="32.0" stroke-linecap="round"/>
<rect x="300.0" y="133.0" width="200" height="34" rx="17.0" fill="#1a202c"/>
<rect x="300.0" y="133.0" width="200" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="400.0" y="155.0" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">100 Ω  =  10.0 mS</text>
<path d="M110,220 C190,220 200,290 280,290 L520,290 C600,290 610,220 690,220" fill="none" stroke="#90cdf4" stroke-opacity="0.18" stroke-width="32.5"/>
<path d="M110,220 C190,220 200,290 280,290 L520,290 C600,290 610,220 690,220" fill="none" stroke="#3182ce" stroke-width="14.5" stroke-linecap="round"/>
<rect x="300.0" y="273.0" width="200" height="34" rx="17.0" fill="#1a202c"/>
<rect x="300.0" y="273.0" width="200" height="34" rx="17.0" fill="url(#gloss)"/>
<text x="400.0" y="295.0" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">220 Ω  =  4.5 mS</text>
<rect x="83.0" y="205.0" width="54" height="30" rx="15.0" fill="#d97706"/>
<rect x="83.0" y="205.0" width="54" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="110.0" y="224.7" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">in</text>
<rect x="660.0" y="205.0" width="60" height="30" rx="15.0" fill="#d97706"/>
<rect x="660.0" y="205.0" width="60" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="690.0" y="224.7" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">out</text>
<text x="400.0" y="368.0" font-size="16" fill="#9ae6b4" text-anchor="middle" font-weight="bold">total conductance: 10.0 + 4.5 = 14.5 mS</text>
<text x="400.0" y="392.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">so the pair together is 1 ÷ 0.0145 S = 68.8 Ω, less than either path alone</text>
</svg>
