<text x="686.4" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 MΩ</text>
<line x1="750.0" y1="188" x2="750.0" y2="194" stroke="#a0aec0"/>
<text x="750.0" y="208.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 MΩ</text>
