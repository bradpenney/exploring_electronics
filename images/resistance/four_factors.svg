<ellipse cx="50.0" cy="290" rx="4.8" ry="12" fill="#aab3c0"/>
<text x="110.0" y="262.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">nichrome</text>
<text x="110.0" y="336.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">65× the resistance</text>
<rect x="215" y="52" width="190" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="310.0" y="82.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Length</text>
<ellipse cx="310.0" cy="182" rx="41.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="275.0" y="148" width="70" height="24" fill="url(#cu)"/>
<ellipse cx="345.0" cy="160" rx="4.8" ry="12" fill="url(#cu)"/>
<ellipse cx="275.0" cy="160" rx="4.8" ry="12" fill="#d5966c"/>
<text x="310.0" y="132.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1 m</text>
<text x="310.0" y="206.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">1.00× the resistance</text>
<ellipse cx="310.0" cy="312" rx="76.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="240.0" y="278" width="140" height="24" fill="url(#cu)"/>
<ellipse cx="380.0" cy="290" rx="4.8" ry="12" fill="url(#cu)"/>
<ellipse cx="240.0" cy="290" rx="4.8" ry="12" fill="#d5966c"/>
<text x="310.0" y="262.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">2 m</text>
<text x="310.0" y="336.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">2.00× the resistance</text>
<rect x="415" y="52" width="190" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="510.0" y="82.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Thickness</text>
<ellipse cx="510.0" cy="179" rx="66.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="450.0" y="151" width="120" height="18" fill="url(#cu)"/>
<ellipse cx="570.0" cy="160" rx="3.6" ry="9" fill="url(#cu)"/>
<ellipse cx="450.0" cy="160" rx="3.6" ry="9" fill="#d5966c"/>
<text x="510.0" y="135.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1 mm²</text>
<text x="510.0" y="203.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">1.00× the resistance</text>
<ellipse cx="510.0" cy="313" rx="66.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="450.0" y="277" width="120" height="26" fill="url(#cu)"/>
<ellipse cx="570.0" cy="290" rx="5.2" ry="13" fill="url(#cu)"/>
<ellipse cx="450.0" cy="290" rx="5.2" ry="13" fill="#d5966c"/>
<text x="510.0" y="261.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">2 mm²</text>
<text x="510.0" y="337.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">0.50× the resistance</text>
<rect x="615" y="52" width="190" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="710.0" y="82.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Temperature</text>
<ellipse cx="710.0" cy="182" rx="66.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="650.0" y="148" width="120" height="24" fill="url(#cu)"/>
<ellipse cx="770.0" cy="160" rx="4.8" ry="12" fill="url(#cu)"/>
<ellipse cx="650.0" cy="160" rx="4.8" ry="12" fill="#d5966c"/>
<text x="710.0" y="132.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">20 °C</text>
<text x="710.0" y="206.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">1.00× the resistance</text>
<rect x="640.0" y="266" width="140" height="48" rx="24" fill="#fc8181" fill-opacity="0.22"/>
<ellipse cx="710.0" cy="312" rx="66.0" ry="6" fill="#000" fill-opacity="0.35"/>
<rect x="650.0" y="278" width="120" height="24" fill="url(#cuhot)"/>
<ellipse cx="770.0" cy="290" rx="4.8" ry="12" fill="url(#cuhot)"/>
<ellipse cx="650.0" cy="290" rx="4.8" ry="12" fill="#e7835f"/>
<text x="710.0" y="262.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">70 °C</text>
<text x="710.0" y="336.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">1.19× the resistance</text>
<text x="410.0" y="462.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">reference: 1 m of 1 mm² copper at 20 °C is 16.8 mΩ</text>
</svg>
