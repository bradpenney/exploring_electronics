<text x="410.0" y="362.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Almost every value's band reaches the next one, so almost any resistance is within 10% of a stock part.</text>
<text x="410.0" y="384.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">The rounded historic values leave two hairline gaps per decade.</text>
