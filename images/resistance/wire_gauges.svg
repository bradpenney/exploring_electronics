<text x="490.0" y="280.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">14 AWG</text>
<text x="490.0" y="300.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">2.08 mm²</text>
<text x="490.0" y="320.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">0.81 Ω per 100 m</text>
