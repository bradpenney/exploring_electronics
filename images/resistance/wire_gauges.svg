<text x="305.0" y="300.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">0.82 mm²</text>
<text x="305.0" y="320.0" font-size="13" fill="#9ae6b4" text-anchor="middle" font-weight="bold">2.04 Ω per 100 m</text>
<text x="305.0" y="342.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">lamp cord</text>
