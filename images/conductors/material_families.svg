<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three atoms: loosely held valence electrons make a conductor, four bonded electrons a semiconductor, tightly held electrons an insulator</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><radialGradient id="shellg" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0" stop-opacity="0.18"/><stop offset="0.75" stop-color="#2d3748" stop-opacity="0.05"/><stop offset="1" stop-color="#a0aec0" stop-opacity="0.3"/></radialGradient><radialGradient id="heat" r="50%"><stop offset="0" stop-color="#fc8181" stop-opacity="0.7"/><stop offset="1" stop-color="#fc8181" stop-opacity="0"/></radialGradient></defs>
<rect x="15" y="15" width="240" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="135.0" y="48.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1 to 3 valence electrons</text>
<ellipse cx="135" cy="238" rx="60" ry="10" fill="#000" fill-opacity="0.35"/>
<circle cx="135" cy="160" r="62" fill="url(#shellg)" stroke="#a0aec0" stroke-opacity="0.45"/>
<ellipse cx="135" cy="160" rx="62" ry="18" fill="none" stroke="#a0aec0" stroke-opacity="0.3" stroke-dasharray="3 5" transform="rotate(-18 135 160)"/>
<circle cx="135" cy="160" r="22" fill="url(#core)"/>
<line x1="153.3" y1="106.7" x2="247" y2="108" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 7"/>
<circle cx="247" cy="108" r="22" fill="url(#glow)"/><circle cx="247" cy="108" r="9" fill="url(#vball)"/>
<text x="135.0" y="278.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">held loosely: they leave</text>
<text x="135.0" y="296.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">and join a shared sea</text>
<rect x="40" y="330" width="190" height="64" rx="14" fill="#48bb78" fill-opacity="0.22" stroke="#48bb78" stroke-opacity="0.7"/>
<rect x="40" y="330" width="190" height="64" rx="14" fill="url(#gloss)"/>
<text x="135.0" y="360.0" font-size="18" fill="#48bb78" text-anchor="middle" font-weight="bold">Conductor</text>
<text x="135.0" y="382.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">copper, silver, gold, aluminum</text>
<text x="135.0" y="430.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">→ resistance rises when heated</text>
<rect x="270" y="15" width="240" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="390.0" y="48.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">4 valence electrons</text>
<ellipse cx="390" cy="238" rx="60" ry="10" fill="#000" fill-opacity="0.35"/>
<circle cx="390" cy="160" r="62" fill="url(#shellg)" stroke="#a0aec0" stroke-opacity="0.45"/>
<ellipse cx="390" cy="160" rx="62" ry="18" fill="none" stroke="#a0aec0" stroke-opacity="0.3" stroke-dasharray="3 5" transform="rotate(-18 390 160)"/>
<circle cx="390" cy="160" r="22" fill="url(#core)"/>
<circle cx="451.2" cy="104.3" r="16" fill="url(#heat)"/>
<line x1="408.3" y1="106.7" x2="494" y2="102" stroke="#fc8181" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 6"/>
<circle cx="494" cy="102" r="8" fill="url(#vball)"/>
<line x1="449.2" y1="176.5" x2="477.9" y2="184.5" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="477.9" cy="184.5" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="449.2" cy="176.5" r="7.5" fill="url(#vball)"/>
<line x1="371.7" y1="213.3" x2="362.8" y2="239.1" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="362.8" cy="239.1" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="371.7" cy="213.3" r="7.5" fill="url(#vball)"/>
<line x1="330.8" y1="143.5" x2="302.1" y2="135.5" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="302.1" cy="135.5" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="330.8" cy="143.5" r="7.5" fill="url(#vball)"/>
<text x="390.0" y="278.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">all bonded, but heat</text>
<text x="390.0" y="296.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">shakes a few loose</text>
<rect x="295" y="330" width="190" height="64" rx="14" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.7"/>
<rect x="295" y="330" width="190" height="64" rx="14" fill="url(#gloss)"/>
<text x="390.0" y="360.0" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="bold">Semiconductor</text>
<text x="390.0" y="382.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">silicon, germanium</text>
<text x="390.0" y="430.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">→ resistance falls when heated</text>
<rect x="525" y="15" width="240" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="645.0" y="48.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5 to 8 valence electrons</text>
<ellipse cx="645" cy="238" rx="60" ry="10" fill="#000" fill-opacity="0.35"/>
<circle cx="645" cy="160" r="62" fill="url(#shellg)" stroke="#a0aec0" stroke-opacity="0.45"/>
<ellipse cx="645" cy="160" rx="62" ry="18" fill="none" stroke="#a0aec0" stroke-opacity="0.3" stroke-dasharray="3 5" transform="rotate(-18 645 160)"/>
<circle cx="645" cy="160" r="22" fill="url(#core)"/>
<line x1="663.3" y1="106.7" x2="672.2" y2="80.9" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="672.2" cy="80.9" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="663.3" cy="106.7" r="7.5" fill="url(#vball)"/>
<line x1="705.5" y1="147.6" x2="734.7" y2="141.6" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="734.7" cy="141.6" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="705.5" cy="147.6" r="7.5" fill="url(#vball)"/>
<line x1="687.1" y1="200.9" x2="707.5" y2="220.7" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="707.5" cy="220.7" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="687.1" cy="200.9" r="7.5" fill="url(#vball)"/>
<line x1="626.7" y1="213.3" x2="617.8" y2="239.1" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="617.8" cy="239.1" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="626.7" cy="213.3" r="7.5" fill="url(#vball)"/>
<line x1="584.5" y1="172.4" x2="555.3" y2="178.4" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="555.3" cy="178.4" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="584.5" cy="172.4" r="7.5" fill="url(#vball)"/>
<line x1="602.9" y1="119.1" x2="582.5" y2="99.3" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
<circle cx="582.5" cy="99.3" r="6" fill="url(#eball)" opacity="0.8"/>
<circle cx="602.9" cy="119.1" r="7.5" fill="url(#vball)"/>
<text x="645.0" y="278.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">held tightly: every one</text>
<text x="645.0" y="296.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">locked into a bond</text>
<rect x="550" y="330" width="190" height="64" rx="14" fill="#fc8181" fill-opacity="0.22" stroke="#fc8181" stroke-opacity="0.7"/>
<rect x="550" y="330" width="190" height="64" rx="14" fill="url(#gloss)"/>
<text x="645.0" y="360.0" font-size="18" fill="#fc8181" text-anchor="middle" font-weight="bold">Insulator</text>
<text x="645.0" y="382.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">glass, porcelain, rubber, plastic</text>
<text x="645.0" y="430.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">→ blocks current</text>
</svg>
