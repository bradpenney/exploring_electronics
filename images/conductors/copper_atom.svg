<text x="484.0" y="62.0" font-size="17" fill="#fbbf24" text-anchor="start" font-weight="bold">1 valence electron</text>
<text x="484.0" y="84.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">far from the nucleus,</text>
<text x="484.0" y="103.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">screened by 28 others,</text>
<text x="484.0" y="122.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">loosely held</text>
<text x="484.0" y="168.0" font-size="14" fill="#a0aec0" text-anchor="start" font-weight="normal">Nucleus: 29 protons</text>
<text x="484.0" y="187.0" font-size="14" fill="#a0aec0" text-anchor="start" font-weight="normal">and 35 neutrons</text>
<text x="484.0" y="260.0" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="bold">The same ending, three metals:</text>
<text x="484.0" y="292.0" font-size="14" fill="#a0aec0" text-anchor="start" font-weight="normal">Copper (29)</text>
<text x="574" y="292" font-size="14" fill="#e6e6e6">2 · 8 · 18 · <tspan fill="#fbbf24" font-weight="bold">1</tspan></text>
<text x="484.0" y="322.0" font-size="14" fill="#a0aec0" text-anchor="start" font-weight="normal">Silver (47)</text>
<text x="574" y="322" font-size="14" fill="#e6e6e6">2 · 8 · 18 · 18 · <tspan fill="#fbbf24" font-weight="bold">1</tspan></text>
<text x="484.0" y="352.0" font-size="14" fill="#a0aec0" text-anchor="start" font-weight="normal">Gold (79)</text>
<text x="574" y="352" font-size="14" fill="#e6e6e6">2 · 8 · 18 · 32 · 18 · <tspan fill="#fbbf24" font-weight="bold">1</tspan></text>
