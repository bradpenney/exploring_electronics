<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two waveforms, SCL above SDA. While SCL is high, SDA falls: the START condition. Then SCL pulses nine times. During the first seven, SDA carries the address 0x18 most significant bit first, 0 0 1 1 0 0 0; the eighth is a 0 for write; on the ninth the target pulls SDA low to acknowledge. Finally SDA rises while SCL is high: STOP. SDA only changes while SCL is low, except at START and STOP.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">START, then address 0x18 (0011000) and a write bit, then ACK</text>
<text x="80.0" y="139.0" font-size="13" fill="#90cdf4" text-anchor="end" font-weight="bold">SCL</text>
<text x="80.0" y="259.0" font-size="13" fill="#fbbf24" text-anchor="end" font-weight="bold">SDA</text>
<polyline points="90.0,110.0 199.4,110.0 199.4,160.0 230.6,160.0 230.6,110.0 261.9,110.0 261.9,160.0 293.1,160.0 293.1,110.0 324.4,110.0 324.4,160.0 355.6,160.0 355.6,110.0 386.9,110.0 386.9,160.0 418.1,160.0 418.1,110.0 449.4,110.0 449.4,160.0 480.6,160.0 480.6,110.0 511.9,110.0 511.9,160.0 543.1,160.0 543.1,110.0 574.4,110.0 574.4,160.0 605.6,160.0 605.6,110.0 636.9,110.0 636.9,160.0 668.1,160.0 668.1,110.0 699.4,110.0 699.4,160.0 730.6,160.0 730.6,110.0 761.9,110.0 761.9,160.0 793.1,160.0 793.1,110.0 840.0,110.0" fill="none" stroke="#90cdf4" stroke-width="3" stroke-linejoin="round" filter="url(#softglow)"/>
<polyline points="90.0,230.0 177.5,230.0 177.5,280.0 215.0,280.0 215.0,280.0 277.5,280.0 277.5,280.0 277.5,280.0 340.0,280.0 340.0,280.0 340.0,230.0 402.5,230.0 402.5,230.0 402.5,230.0 465.0,230.0 465.0,230.0 465.0,280.0 527.5,280.0 527.5,280.0 527.5,280.0 590.0,280.0 590.0,280.0 590.0,280.0 652.5,280.0 652.5,280.0 652.5,280.0 715.0,280.0 715.0,280.0 715.0,280.0 777.5,280.0 777.5,280.0 815.0,280.0 815.0,230.0 840.0,230.0" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" filter="url(#softglow)"/>
<text x="246.2" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="246.2" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 6</text>
<text x="308.8" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="308.8" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 5</text>
<text x="371.2" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1</text>
<text x="371.2" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 4</text>
<text x="433.8" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1</text>
<text x="433.8" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 3</text>
<text x="496.2" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="496.2" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 2</text>
<text x="558.8" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="558.8" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 1</text>
<text x="621.2" y="310.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0</text>
<text x="621.2" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">bit 0</text>
<text x="683.8" y="310.0" font-size="14" fill="#fc8181" text-anchor="middle" font-weight="bold">W</text>
<text x="683.8" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">write</text>
<text x="746.2" y="310.0" font-size="14" fill="#48bb78" text-anchor="middle" font-weight="bold">ACK</text>
<text x="746.2" y="328.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">target</text>
<text x="177.5" y="96.0" font-size="12" fill="#48bb78" text-anchor="middle" font-weight="bold">START</text>
<text x="815.0" y="96.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="bold">STOP</text>
<text x="450.0" y="395.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">SDA only changes while SCL is low; a change while SCL is high is START or STOP</text>
</svg>
