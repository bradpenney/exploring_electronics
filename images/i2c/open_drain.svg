<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two panels of an open-drain line shared by three devices, each able only to connect the line to ground through a switch, with a pull-up resistor to 5 volts. Left: no switch closed, so the resistor lifts the line to 5 volts, HIGH. Right: device 2 closes its switch and the line goes to 0 volts, LOW. No device ever drives the line high, so two devices can never fight.</title>
