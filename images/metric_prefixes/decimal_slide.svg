<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three rows showing the same current: 0.025 amps, then 25 milliamps, then 25,000 microamps, with arrows marking a factor of 1,000 at each step down to a smaller unit.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="770" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Converting is sliding the decimal point three places at a time</text>
<rect x="140.0" y="95.0" width="220" height="50" rx="25.0" fill="#2d3748"/>
<rect x="140.0" y="95.0" width="220" height="50" rx="25.0" fill="url(#gloss)"/>
<text x="250.0" y="127.9" font-size="22" fill="#9ae6b4" text-anchor="middle" font-weight="bold">0.025 A</text>
<text x="400.0" y="126.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">a big unit: a small number</text>
<path d="M250,148 L250,172" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="262.0" y="166.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="bold">× 1,000</text>
<rect x="140.0" y="175.0" width="220" height="50" rx="25.0" fill="#2d3748"/>
<rect x="140.0" y="175.0" width="220" height="50" rx="25.0" fill="url(#gloss)"/>
<text x="250.0" y="207.9" font-size="22" fill="#9ae6b4" text-anchor="middle" font-weight="bold">25 mA</text>
<text x="400.0" y="206.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">1,000× smaller unit: 1,000× bigger number</text>
<path d="M250,228 L250,252" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="262.0" y="246.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="bold">× 1,000</text>
<rect x="140.0" y="255.0" width="220" height="50" rx="25.0" fill="#2d3748"/>
<rect x="140.0" y="255.0" width="220" height="50" rx="25.0" fill="url(#gloss)"/>
<text x="250.0" y="287.9" font-size="22" fill="#9ae6b4" text-anchor="middle" font-weight="bold">25 000 µA</text>
<text x="400.0" y="286.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">another 1,000×</text>
<text x="400.0" y="352.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">bigger unit → smaller number; smaller unit → bigger number. The amount never changes.</text>
</svg>
