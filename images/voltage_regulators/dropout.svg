<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Output voltage against input voltage for two 5 volt linear regulators, simplified. Below a knee the output follows the input minus the dropout voltage; above it the output holds at 5 volts. The 7805 needs 7 volts in, with 2 volts of dropout at 1 amp. The low-dropout LM1117-5.0 needs 6.2 volts, with 1.2 volts of dropout at 800 milliamps.</title>
