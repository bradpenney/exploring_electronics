<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two traces. Top: the voltage at a buck converter's switch, a square wave between 0 and 12 volts that is on 42 percent of each cycle, averaging 5 volts, switching 150,000 times a second on the LM2596. Bottom: after the inductor and capacitor, a steady 5 volts with a small ripple.</title>
