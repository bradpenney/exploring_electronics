<text x="242.0" y="114.0" font-size="12" fill="#a0aec0" text-anchor="end" font-weight="normal" font-style="italic">the reading, its unit, and OL for overload</text>
<line x1="388.0" y1="305" x2="250" y2="260" stroke="#a0aec0" stroke-width="1.5"/>
<circle cx="388.0" cy="305" r="4" fill="#fbbf24"/>
<text x="242.0" y="256.0" font-size="15" fill="#fbbf24" text-anchor="end" font-weight="bold">Dial</text>
<text x="242.0" y="274.0" font-size="12" fill="#a0aec0" text-anchor="end" font-weight="normal" font-style="italic">chooses what to measure</text>
<line x1="370" y1="438" x2="250" y2="400" stroke="#a0aec0" stroke-width="1.5"/>
<circle cx="370" cy="438" r="4" fill="#fbbf24"/>
<text x="242.0" y="396.0" font-size="15" fill="#fbbf24" text-anchor="end" font-weight="bold">Jacks</text>
<text x="242.0" y="414.0" font-size="12" fill="#a0aec0" text-anchor="end" font-weight="normal" font-style="italic">choose how the meter is wired inside</text>
<line x1="542.0" y1="265" x2="650" y2="220" stroke="#a0aec0" stroke-width="1.5"/>
<circle cx="542.0" cy="265" r="4" fill="#fbbf24"/>
<text x="658.0" y="216.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">Symbols</text>
<text x="658.0" y="234.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">V⎓ DC volts, V~ AC volts, Ω ohms,</text>
<text x="658.0" y="250.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">•))) continuity, →| diode, A amps</text>
<line x1="530" y1="472" x2="650" y2="420" stroke="#a0aec0" stroke-width="1.5"/>
<circle cx="530" cy="472" r="4" fill="#fbbf24"/>
<text x="658.0" y="416.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">Probe leads</text>
<text x="658.0" y="434.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">black always in COM; red moves</text>
