<circle cx="446" cy="451" r="4" fill="#ffffff" fill-opacity="0.45"/>
<text x="450.0" y="489.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">COM</text>
<circle cx="530" cy="455" r="17" fill="#111"/>
<circle cx="530" cy="455" r="17" fill="none" stroke="#808895" stroke-width="3"/>
<circle cx="530" cy="455" r="6" fill="#555"/>
