<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two 3D bars for the same 0.1 ohm short circuit. Four alkaline AA cells, with 0.6 to 1.2 ohms of internal resistance between them, push 4.6 to 8.6 amps, heating the short with 2.1 to 7.3 watts. A bench supply with a 100 milliamp limit pushes 100 milliamps, heating it with 1 milliwatt.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="425" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="460" y="15" width="425" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="227.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Four AA cells, 0.1 Ω short</text>
<ellipse cx="242.4" cy="335.0" rx="71.4" ry="7.9" fill="#000" fill-opacity="0.4"/>
<polygon points="177.0,120.5 277.0,120.5 307.8,100.7 207.8,100.7" fill="#fca6a6"/>
<rect x="177.0" y="120.5" width="100.0" height="209.5" fill="#fc8181"/>
<rect x="177.0" y="120.5" width="100.0" height="209.5" fill="url(#gloss)" opacity="0.6"/>
<polygon points="277.0,330.0 277.0,120.5 307.8,100.7 307.8,310.2" fill="#8a4646"/>
<text x="245.0" y="94.5" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">4.6 to 8.6 A</text>
<text x="227.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">limited only by the cells' own resistance</text>
<text x="227.0" y="384.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">2.1 to 7.3 W heating the short</text>
<text x="672.0" y="50.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Bench supply, 100 mA limit</text>
<ellipse cx="687.4" cy="335.0" rx="71.4" ry="7.9" fill="#000" fill-opacity="0.4"/>
<polygon points="622.0,322.0 722.0,322.0 752.8,302.2 652.8,302.2" fill="#7ecfa0"/>
<rect x="622.0" y="322.0" width="100.0" height="8.0" fill="#48bb78"/>
<rect x="622.0" y="322.0" width="100.0" height="8.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="722.0,330.0 722.0,322.0 752.8,302.2 752.8,310.2" fill="#276642"/>
<text x="690.0" y="296.0" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 mA</text>
<text x="672.0" y="364.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">limited by the setting</text>
<text x="672.0" y="384.0" font-size="13" fill="#48bb78" text-anchor="middle" font-weight="bold">1 mW heating the short</text>
<text x="450.0" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">bars on the same scale; alkaline AA internal resistance 150 to 300 mΩ each</text>
</svg>
