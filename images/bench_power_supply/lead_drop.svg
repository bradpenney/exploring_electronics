<text x="305.0" y="344.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">at the circuit</text>
<text x="255.0" y="368.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">22 AWG hookup wire: 103 mΩ, 0.21 V lost</text>
<ellipse cx="507.6" cy="325.0" rx="53.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="460.0,153.3 530.0,153.3 555.2,137.1 485.2,137.1" fill="#808895"/>
<rect x="460.0" y="153.3" width="70.0" height="166.7" fill="#4a5568"/>
<rect x="460.0" y="153.3" width="70.0" height="166.7" fill="url(#gloss)" opacity="0.6"/>
<polygon points="530.0,320.0 530.0,153.3 555.2,137.1 555.2,303.8" fill="#282e39"/>
<ellipse cx="607.6" cy="325.0" rx="53.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="560.0,156.1 630.0,156.1 655.2,139.9 585.2,139.9" fill="#7ecfa0"/>
<rect x="560.0" y="156.1" width="70.0" height="163.9" fill="#48bb78"/>
<rect x="560.0" y="156.1" width="70.0" height="163.9" fill="url(#gloss)" opacity="0.6"/>
<polygon points="630.0,320.0 630.0,156.1 655.2,139.9 655.2,303.8" fill="#276642"/>
<text x="495.0" y="129.3" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5.00 V</text>
<text x="595.0" y="132.1" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">4.92 V</text>
<text x="495.0" y="344.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">at the supply</text>
<text x="595.0" y="344.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">at the circuit</text>
<text x="545.0" y="368.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">18 AWG lamp cord: 41 mΩ, 0.08 V lost</text>
<ellipse cx="772.6" cy="325.0" rx="53.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="725.0,153.3 795.0,153.3 820.2,137.1 750.2,137.1" fill="#7ecfa0"/>
<rect x="725.0" y="153.3" width="70.0" height="166.7" fill="#48bb78"/>
<rect x="725.0" y="153.3" width="70.0" height="166.7" fill="url(#gloss)" opacity="0.6"/>
<polygon points="795.0,320.0 795.0,153.3 820.2,137.1 820.2,303.8" fill="#276642"/>
<text x="760.0" y="129.3" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5.00 V</text>
<text x="760.0" y="344.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">with sense leads</text>
<text x="760.0" y="368.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">supply raises its output</text>
<text x="760.0" y="384.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">to make up the drop</text>
</svg>
