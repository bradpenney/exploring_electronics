<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two curves as the load resistance falls from 1 kilohm to 0.1 ohm on a log scale. The voltage holds at 5 volts while the current rises, until the load reaches 50 ohms, the crossover. Below that the current holds at 100 milliamps and the voltage falls, until a short circuit sees 100 milliamps at only 0.01 volts.</title>
