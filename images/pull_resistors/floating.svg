<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two voltage traces on an input pin, with readings taken at intervals. Floating, with nothing connected, the voltage wanders up and down through the grey band between 1.5 and 3 volts, and the readings flip between HIGH, LOW and uncertain at random. With a 10 kilohm pull-down, the voltage sits steady near 0 volts and every reading is LOW.</title>
