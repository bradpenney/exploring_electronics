<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Four 3D bars of the current wasted through a pull resistor while the button is held, on a log scale. 100 ohms wastes 50 milliamps, too strong. 10 kilohms wastes 0.5 milliamps, the everyday default. The Uno's built-in 20 to 50 kilohm pull-up wastes 0.1 to 0.25 milliamps. 10 megohms wastes half a microamp but is so weak that noise wins.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Current wasted while the button is held, 5 V across the pull resistor</text>
<ellipse cx="169.0" cy="325.0" rx="65.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="110.0,110.0 200.0,110.0 228.0,92.0 138.0,92.0" fill="#fca6a6"/>
<rect x="110.0" y="110.0" width="90.0" height="210.0" fill="#fc8181"/>
<rect x="110.0" y="110.0" width="90.0" height="210.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="200.0,320.0 200.0,110.0 228.0,92.0 228.0,302.0" fill="#8a4646"/>
<text x="170.0" y="84.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">50 mA</text>
<text x="155.0" y="348.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 Ω</text>
<text x="155.0" y="366.0" font-size="11" fill="#fca0a0" text-anchor="middle" font-weight="normal" font-style="italic">too strong: wastes current</text>
<ellipse cx="359.0" cy="325.0" rx="65.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="300.0,183.7 390.0,183.7 418.0,165.7 328.0,165.7" fill="#7ecfa0"/>
<rect x="300.0" y="183.7" width="90.0" height="136.3" fill="#48bb78"/>
<rect x="300.0" y="183.7" width="90.0" height="136.3" fill="url(#gloss)" opacity="0.6"/>
<polygon points="390.0,320.0 390.0,183.7 418.0,165.7 418.0,302.0" fill="#276642"/>
<text x="360.0" y="157.7" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0.5 mA</text>
<text x="345.0" y="348.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">10 kΩ</text>
<text x="345.0" y="366.0" font-size="11" fill="#75cc99" text-anchor="middle" font-weight="normal" font-style="italic">the everyday default</text>
<ellipse cx="549.0" cy="325.0" rx="65.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="490.0,203.7 580.0,203.7 608.0,185.7 518.0,185.7" fill="#73c9c4"/>
<rect x="490.0" y="203.7" width="90.0" height="116.3" fill="#38b2ac"/>
<rect x="490.0" y="203.7" width="90.0" height="116.3" fill="url(#gloss)" opacity="0.6"/>
<polygon points="580.0,320.0 580.0,203.7 608.0,185.7 608.0,302.0" fill="#1e615e"/>
<text x="550.0" y="177.7" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0.1–0.25 mA</text>
<text x="535.0" y="348.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">20–50 kΩ</text>
<text x="535.0" y="366.0" font-size="11" fill="#69c5c0" text-anchor="middle" font-weight="normal" font-style="italic">the Uno's built-in pull-up</text>
<ellipse cx="739.0" cy="325.0" rx="65.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="680.0,294.2 770.0,294.2 798.0,276.2 708.0,276.2" fill="#f8bb54"/>
<rect x="680.0" y="294.2" width="90.0" height="25.8" fill="#f59e0b"/>
<rect x="680.0" y="294.2" width="90.0" height="25.8" fill="url(#gloss)" opacity="0.6"/>
<polygon points="770.0,320.0 770.0,294.2 798.0,276.2 798.0,302.0" fill="#865606"/>
<text x="740.0" y="268.2" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">0.5 µA</text>
<text x="725.0" y="348.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">10 MΩ</text>
<text x="725.0" y="366.0" font-size="11" fill="#f7b648" text-anchor="middle" font-weight="normal" font-style="italic">too weak: noise wins</text>
<text x="450.0" y="82.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">bar height on a log scale</text>
</svg>
