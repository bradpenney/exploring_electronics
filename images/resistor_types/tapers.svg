<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Resistance from one end to the wiper against shaft rotation, for two potentiometer tapers. A linear taper is a straight line: half-way turned gives half the resistance. A logarithmic, or audio, taper curves up slowly, giving about a tenth of the resistance at half-way, then rises steeply.</title>
