<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three 3D bars of the time to send a 39-character line, including its line ending. At 9600 baud it takes 40.6 milliseconds; at 57600, 6.8; at 115200, 3.4.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Time to send one 39-character line from Reading an Analog Sensor</text>
<ellipse cx="221.1" cy="325.0" rx="67.1" ry="8.3" fill="#000" fill-opacity="0.4"/>
<polygon points="160.0,139.4 250.0,139.4 282.2,118.7 192.2,118.7" fill="#f8bb54"/>
<rect x="160.0" y="139.4" width="90.0" height="180.6" fill="#f59e0b"/>
<rect x="160.0" y="139.4" width="90.0" height="180.6" fill="url(#gloss)" opacity="0.6"/>
<polygon points="250.0,320.0 250.0,139.4 282.2,118.7 282.2,299.3" fill="#865606"/>
<text x="221.0" y="113.4" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">40.6 ms</text>
<text x="205.0" y="350.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">9,600 baud</text>
<text x="205.0" y="368.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">960 characters/s</text>
<ellipse cx="451.1" cy="325.0" rx="67.1" ry="8.3" fill="#000" fill-opacity="0.4"/>
<polygon points="390.0,289.9 480.0,289.9 512.2,269.2 422.2,269.2" fill="#7ecfa0"/>
<rect x="390.0" y="289.9" width="90.0" height="30.1" fill="#48bb78"/>
<rect x="390.0" y="289.9" width="90.0" height="30.1" fill="url(#gloss)" opacity="0.6"/>
<polygon points="480.0,320.0 480.0,289.9 512.2,269.2 512.2,299.3" fill="#276642"/>
<text x="451.0" y="263.9" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">6.8 ms</text>
<text x="435.0" y="350.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">57,600 baud</text>
<text x="435.0" y="368.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">5,760 characters/s</text>
<ellipse cx="681.1" cy="325.0" rx="67.1" ry="8.3" fill="#000" fill-opacity="0.4"/>
<polygon points="620.0,305.0 710.0,305.0 742.2,284.3 652.2,284.3" fill="#7ecfa0"/>
<rect x="620.0" y="305.0" width="90.0" height="15.0" fill="#48bb78"/>
<rect x="620.0" y="305.0" width="90.0" height="15.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="710.0,320.0 710.0,305.0 742.2,284.3 742.2,299.3" fill="#276642"/>
<text x="681.0" y="279.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">3.4 ms</text>
<text x="665.0" y="350.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">115,200 baud</text>
<text x="665.0" y="368.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">11,520 characters/s</text>
<text x="450.0" y="82.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">10 bits per character (start, 8 data, stop)</text>
</svg>
