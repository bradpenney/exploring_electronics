<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two 3D boards, A and B. A's TX pin connects to B's RX, and B's TX pin connects to A's RX, so the two signal wires cross; a third wire joins their grounds, the reference both sides measure from.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Two wires and a ground: each TX talks to the other's RX</text>
<ellipse cx="211.0" cy="305.0" rx="127.0" ry="10.8" fill="#000" fill-opacity="0.4"/>
<polygon points="90.0,120.0 290.0,120.0 332.0,93.0 132.0,93.0" fill="#6da98b"/>
<rect x="90.0" y="120.0" width="200.0" height="180.0" fill="#2f855a"/>
<rect x="90.0" y="120.0" width="200.0" height="180.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="290.0,300.0 290.0,120.0 332.0,93.0 332.0,273.0" fill="#194931"/>
<text x="190.0" y="145.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Device A</text>
<ellipse cx="731.0" cy="305.0" rx="127.0" ry="10.8" fill="#000" fill-opacity="0.4"/>
<polygon points="610.0,120.0 810.0,120.0 852.0,93.0 652.0,93.0" fill="#6da98b"/>
<rect x="610.0" y="120.0" width="200.0" height="180.0" fill="#2f855a"/>
<rect x="610.0" y="120.0" width="200.0" height="180.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="810.0,300.0 810.0,120.0 852.0,93.0 852.0,273.0" fill="#194931"/>
<text x="710.0" y="145.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Device B</text>
<text x="270.0" y="175.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="bold">TX</text>
<circle cx="290" cy="170" r="6" fill="#e2e8f0"/>
<text x="270.0" y="225.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="bold">RX</text>
<circle cx="290" cy="220" r="6" fill="#e2e8f0"/>
<text x="270.0" y="275.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="bold">GND</text>
<circle cx="290" cy="270" r="6" fill="#e2e8f0"/>
<text x="630.0" y="175.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">RX</text>
<circle cx="610" cy="170" r="6" fill="#e2e8f0"/>
<text x="630.0" y="225.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">TX</text>
<circle cx="610" cy="220" r="6" fill="#e2e8f0"/>
<text x="630.0" y="275.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">GND</text>
<circle cx="610" cy="270" r="6" fill="#e2e8f0"/>
<path d="M296,170 L604,170" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M604,220 L296,220" stroke="#90cdf4" stroke-width="4"/>
<path d="M300,220 l16,-8 l0,16 z" fill="#90cdf4"/>
<path d="M296,270 L604,270" stroke="#a0aec0" stroke-width="4"/>
<text x="450.0" y="160.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">A's TX → B's RX</text>
<text x="450.0" y="210.0" font-size="13" fill="#90cdf4" text-anchor="middle" font-weight="bold">A's RX ← B's TX</text>
<text x="450.0" y="296.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">ground to ground: the reference both sides measure from</text>
<text x="450.0" y="345.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">TX always connects to RX. Two TX pins wired together means two talkers and no listener.</text>
</svg>
