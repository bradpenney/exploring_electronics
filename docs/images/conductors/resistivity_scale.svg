<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Log-scale resistivity chart drawn as a glossy tube, from silver and copper through silicon to glass and quartz</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="bands" x1="0" y1="0" x2="1" y2="0"><stop offset="0.000" stop-color="#48bb78"/><stop offset="0.214" stop-color="#48bb78"/><stop offset="0.214" stop-color="#f59e0b"/><stop offset="0.500" stop-color="#f59e0b"/><stop offset="0.500" stop-color="#fc8181"/><stop offset="1.000" stop-color="#fc8181"/></linearGradient></defs>
<rect x="15" y="15" width="750" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="50" y="168" width="680" height="10" rx="5" fill="#000" fill-opacity="0.35"/>
<rect x="50" y="140" width="680" height="30" rx="15.0" fill="url(#bands)" fill-opacity="0.55"/>
<rect x="50" y="140" width="680" height="30" rx="15.0" fill="url(#gloss)" stroke="#e2e8f0" stroke-opacity="0.35"/>
<text x="122.9" y="204.0" font-size="14" fill="#48bb78" text-anchor="middle" font-weight="bold">Conductors</text>
<text x="292.9" y="204.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Semiconductors</text>
<text x="560.0" y="204.0" font-size="14" fill="#fc8181" text-anchor="middle" font-weight="bold">Insulators</text>
<line x1="74.3" y1="172" x2="74.3" y2="178" stroke="#a0aec0"/>
<text x="74.3" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">-8</tspan></text>
