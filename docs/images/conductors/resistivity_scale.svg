<line x1="292.9" y1="172" x2="292.9" y2="178" stroke="#a0aec0"/>
<text x="292.9" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">1</tspan></text>
<line x1="365.7" y1="172" x2="365.7" y2="178" stroke="#a0aec0"/>
<text x="365.7" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">4</tspan></text>
<line x1="438.6" y1="172" x2="438.6" y2="178" stroke="#a0aec0"/>
<text x="438.6" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">7</tspan></text>
<line x1="511.4" y1="172" x2="511.4" y2="178" stroke="#a0aec0"/>
<text x="511.4" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">10</tspan></text>
<line x1="584.3" y1="172" x2="584.3" y2="178" stroke="#a0aec0"/>
<text x="584.3" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">13</tspan></text>
<line x1="657.1" y1="172" x2="657.1" y2="178" stroke="#a0aec0"/>
<text x="657.1" y="228" font-size="12" fill="#a0aec0" text-anchor="middle">10<tspan dy="-5" font-size="9">16</tspan></text>
<circle cx="82.2" cy="155.0" r="9" fill="url(#copperball)"/>
<line x1="82.2" y1="137" x2="82.2" y2="120" stroke="#a0aec0" stroke-width="1"/>
<text x="76.2" y="114.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="normal">silver · copper · gold · aluminum</text>
<rect x="158.7" y="148.0" width="31.6" height="14" rx="7" fill="url(#core)"/><rect x="158.7" y="148.0" width="31.6" height="14" rx="7" fill="url(#gloss)"/>
<line x1="174.5" y1="173" x2="174.5" y2="248" stroke="#a0aec0" stroke-width="1"/>
<text x="174.5" y="262.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">graphite</text>
<rect x="244.3" y="148.0" width="67.5" height="14" rx="7" fill="url(#eball)"/><rect x="244.3" y="148.0" width="67.5" height="14" rx="7" fill="url(#gloss)"/>
<line x1="278.0" y1="173" x2="278.0" y2="248" stroke="#a0aec0" stroke-width="1"/>
<text x="278.0" y="262.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">silicon</text>
<rect x="487.1" y="148.0" width="97.1" height="14" rx="7" fill="url(#eball)"/><rect x="487.1" y="148.0" width="97.1" height="14" rx="7" fill="url(#gloss)"/>
<line x1="535.7" y1="137" x2="535.7" y2="120" stroke="#a0aec0" stroke-width="1"/>
<text x="535.7" y="114.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">glass</text>
<rect x="584.3" y="148.0" width="48.6" height="14" rx="7" fill="url(#core)"/><rect x="584.3" y="148.0" width="48.6" height="14" rx="7" fill="url(#gloss)"/>
<line x1="608.6" y1="173" x2="608.6" y2="248" stroke="#a0aec0" stroke-width="1"/>
<text x="608.6" y="262.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">hard rubber</text>
<circle cx="702.7" cy="155.0" r="9" fill="url(#eball)"/>
<line x1="702.7" y1="137" x2="702.7" y2="120" stroke="#a0aec0" stroke-width="1"/>
<text x="708.7" y="114.0" font-size="14" fill="#e6e6e6" text-anchor="end" font-weight="normal">fused quartz</text>
<text x="390.0" y="50.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Resistivity at room temperature, ohm-metres (log scale: each tick is 1,000×)</text>
<text x="390.0" y="300.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Copper to quartz spans about 25 powers of ten</text>
</svg>
