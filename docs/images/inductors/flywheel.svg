<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>An inductor pictured as a heavy flywheel turned by water in a pipe. Left: when the pump starts, the wheel has to be spun up, so the flow builds slowly. Right: when a valve slams shut, the spinning wheel keeps pushing water and causes a pressure surge.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#495361"/><stop offset="0.22" stop-color="#b0b9c5"/><stop offset="0.5" stop-color="#718096"/><stop offset="1" stop-color="#2d333c"/></linearGradient></defs>
<rect x="20" y="20" width="400" height="360" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="220.0" y="52.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Starting the flow</text>
<rect x="50" y="174" width="340" height="52" rx="10" fill="url(#pipe)" fill-opacity="0.45"/>
<circle cx="220" cy="200" r="62" fill="#2d3748" stroke="#a0aec0" stroke-width="4"/>
<line x1="220" y1="200" x2="278.0" y2="200.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="220" y1="200" x2="249.0" y2="250.2" stroke="#cbd5e0" stroke-width="5"/>
<line x1="220" y1="200" x2="191.0" y2="250.2" stroke="#cbd5e0" stroke-width="5"/>
<line x1="220" y1="200" x2="162.0" y2="200.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="220" y1="200" x2="191.0" y2="149.8" stroke="#cbd5e0" stroke-width="5"/>
<line x1="220" y1="200" x2="249.0" y2="149.8" stroke="#cbd5e0" stroke-width="5"/>
<circle cx="220" cy="200" r="12" fill="url(#core)"/>
<line x1="70" y1="200" x2="90" y2="200" stroke="#90cdf4" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="100" y1="200" x2="120" y2="200" stroke="#90cdf4" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="130" y1="200" x2="150" y2="200" stroke="#90cdf4" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="220.0" y="296.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">pump switched on</text>
<text x="220.0" y="330.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the wheel must be spun up: flow builds slowly</text>
<rect x="440" y="20" width="400" height="360" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="640.0" y="52.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Stopping the flow</text>
<rect x="470" y="174" width="340" height="52" rx="10" fill="url(#pipe)" fill-opacity="0.45"/>
<circle cx="640" cy="200" r="62" fill="#2d3748" stroke="#a0aec0" stroke-width="4"/>
<line x1="640" y1="200" x2="696.0" y2="215.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="640" y1="200" x2="655.0" y2="256.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="640" y1="200" x2="599.0" y2="241.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="640" y1="200" x2="584.0" y2="185.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="640" y1="200" x2="625.0" y2="144.0" stroke="#cbd5e0" stroke-width="5"/>
<line x1="640" y1="200" x2="681.0" y2="159.0" stroke="#cbd5e0" stroke-width="5"/>
<circle cx="640" cy="200" r="12" fill="url(#core)"/>
<line x1="730" y1="200" x2="775" y2="200" stroke="#fc8181" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="785" y="170" width="10" height="60" fill="#fc8181"/>
<text x="790.0" y="160.0" font-size="12" fill="#fc8181" text-anchor="end" font-weight="normal">valve slammed</text>
<text x="640.0" y="296.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">flow cut off suddenly</text>
<text x="640.0" y="330.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the spinning wheel keeps pushing: a pressure surge</text>
</svg>
