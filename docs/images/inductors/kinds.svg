<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Five kinds of inductor. An air-core coil, nanohenries to tens of microhenries, for radio tuning. A coil on a ferrite rod, used in AM radio antennas. A toroid, a ring-shaped core that keeps its field inside. An iron-core choke, millihenries to henries, for power filtering. And a moulded inductor with colour bands, beside a tiny chip inductor.</title>
