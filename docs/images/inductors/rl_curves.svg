<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Left: the current through a 100 millihenry coil with 20 ohms of wire, connected to 12 volts, rises over a time constant of 5 milliseconds toward 0.6 amps. Right: when the switch opens in 1 microsecond, the coil's voltage spikes; L times the change in current over time gives 60,000 volts in theory, in practice an arc across the switch or a destroyed transistor.</title>
