<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three bars of allowed pull-up resistance on a 5 volt bus at 100 kilohertz, from the ATmega328P datasheet. The minimum for every row is 1.53 kilohms, set by the 3 milliamps a device can sink while holding the line below 0.4 volts. The maximum falls as the bus capacitance rises: 10 kilohms at 100 picofarads, 5 at 200, 2.5 at 400. A common 4.7 kilohm resistor sits inside the range for up to about 200 picofarads.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Choosing pull-ups at 100 kHz on a 5 V bus (ATmega328P limits)</text>
<rect x="120" y="124" width="720" height="32" rx="6" fill="#2d3748"/>
<rect x="212.0" y="124" width="508.0" height="32" rx="6" fill="#48bb78" fill-opacity="0.75"/>
<rect x="212.0" y="124" width="508.0" height="32" rx="6" fill="url(#gloss)" opacity="0.5"/>
<text x="110.0" y="145.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">100 pF</text>
<text x="728.0" y="145.0" font-size="13" fill="#48bb78" text-anchor="start" font-weight="bold">up to 10.0 kΩ</text>
<rect x="120" y="204" width="720" height="32" rx="6" fill="#2d3748"/>
<rect x="212.0" y="204" width="208.0" height="32" rx="6" fill="#48bb78" fill-opacity="0.75"/>
<rect x="212.0" y="204" width="208.0" height="32" rx="6" fill="url(#gloss)" opacity="0.5"/>
<text x="110.0" y="225.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">200 pF</text>
<text x="428.0" y="225.0" font-size="13" fill="#48bb78" text-anchor="start" font-weight="bold">up to 5.0 kΩ</text>
<rect x="120" y="284" width="720" height="32" rx="6" fill="#2d3748"/>
<rect x="212.0" y="284" width="58.0" height="32" rx="6" fill="#48bb78" fill-opacity="0.75"/>
<rect x="212.0" y="284" width="58.0" height="32" rx="6" fill="url(#gloss)" opacity="0.5"/>
<text x="110.0" y="305.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">400 pF</text>
<text x="278.0" y="305.0" font-size="13" fill="#48bb78" text-anchor="start" font-weight="bold">up to 2.5 kΩ</text>
<line x1="402.0" y1="110" x2="402.0" y2="330" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
<text x="402.0" y="104.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">4.7 kΩ</text>
<line x1="212.0" y1="110" x2="212.0" y2="330" stroke="#fc8181" stroke-width="2"/>
<text x="206.0" y="104.0" font-size="12" fill="#fc8181" text-anchor="end" font-weight="bold">1.53 kΩ min</text>
<text x="120.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">0 kΩ</text>
<text x="240.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">2 kΩ</text>
<text x="360.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">4 kΩ</text>
<text x="480.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">6 kΩ</text>
<text x="600.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">8 kΩ</text>
<text x="720.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 kΩ</text>
<text x="840.0" y="352.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">12 kΩ</text>
<text x="450.0" y="376.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">pull-up resistance; rows are the bus's total capacitance</text>
<text x="450.0" y="398.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">too small: devices can't pull the line low enough. Too large: the line rises too slowly.</text>
</svg>
