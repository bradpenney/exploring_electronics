<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A strip of thirteen blocks, coloured by who sends each. The controller sends START, address 0x18 with write, then register 0x05, each acknowledged by the target; then a repeated START and address 0x18 with read, acknowledged; then the target sends the upper byte, which the controller acknowledges, and the lower byte, which the controller answers with NACK before sending STOP.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Reading the temperature: one transaction, thirteen pieces</text>
<polygon points="47.0,116.0 81.0,116.0 93.6,107.9 59.6,107.9" fill="#d28863"/>
<rect x="47.0" y="116.0" width="34.0" height="44.0" fill="#c05621"/>
<rect x="47.0" y="116.0" width="34.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="81.0,160.0 81.0,116.0 93.6,107.9 93.6,151.9" fill="#692f12"/>
<text x="64.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>
<polygon points="85.0,116.0 171.0,116.0 183.6,107.9 97.6,107.9" fill="#d28863"/>
<rect x="85.0" y="116.0" width="86.0" height="44.0" fill="#c05621"/>
<rect x="85.0" y="116.0" width="86.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="171.0,160.0 171.0,116.0 183.6,107.9 183.6,151.9" fill="#692f12"/>
<text x="128.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">0x18 W</text>
<polygon points="175.0,116.0 219.0,116.0 231.6,107.9 187.6,107.9" fill="#6da98b"/>
<rect x="175.0" y="116.0" width="44.0" height="44.0" fill="#2f855a"/>
<rect x="175.0" y="116.0" width="44.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="219.0,160.0 219.0,116.0 231.6,107.9 231.6,151.9" fill="#194931"/>
<text x="197.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ACK</text>
<polygon points="223.0,116.0 309.0,116.0 321.6,107.9 235.6,107.9" fill="#d28863"/>
<rect x="223.0" y="116.0" width="86.0" height="44.0" fill="#c05621"/>
<rect x="223.0" y="116.0" width="86.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="309.0,160.0 309.0,116.0 321.6,107.9 321.6,151.9" fill="#692f12"/>
<text x="266.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">reg 0x05</text>
<polygon points="313.0,116.0 357.0,116.0 369.6,107.9 325.6,107.9" fill="#6da98b"/>
<rect x="313.0" y="116.0" width="44.0" height="44.0" fill="#2f855a"/>
<rect x="313.0" y="116.0" width="44.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="357.0,160.0 357.0,116.0 369.6,107.9 369.6,151.9" fill="#194931"/>
<text x="335.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ACK</text>
<polygon points="361.0,116.0 395.0,116.0 407.6,107.9 373.6,107.9" fill="#d28863"/>
<rect x="361.0" y="116.0" width="34.0" height="44.0" fill="#c05621"/>
<rect x="361.0" y="116.0" width="34.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="395.0,160.0 395.0,116.0 407.6,107.9 407.6,151.9" fill="#692f12"/>
<text x="378.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Sr</text>
<polygon points="399.0,116.0 485.0,116.0 497.6,107.9 411.6,107.9" fill="#d28863"/>
<rect x="399.0" y="116.0" width="86.0" height="44.0" fill="#c05621"/>
<rect x="399.0" y="116.0" width="86.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="485.0,160.0 485.0,116.0 497.6,107.9 497.6,151.9" fill="#692f12"/>
<text x="442.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">0x18 R</text>
<polygon points="489.0,116.0 533.0,116.0 545.6,107.9 501.6,107.9" fill="#6da98b"/>
<rect x="489.0" y="116.0" width="44.0" height="44.0" fill="#2f855a"/>
<rect x="489.0" y="116.0" width="44.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="533.0,160.0 533.0,116.0 545.6,107.9 545.6,151.9" fill="#194931"/>
<text x="511.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ACK</text>
<polygon points="537.0,116.0 623.0,116.0 635.6,107.9 549.6,107.9" fill="#6da98b"/>
<rect x="537.0" y="116.0" width="86.0" height="44.0" fill="#2f855a"/>
<rect x="537.0" y="116.0" width="86.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="623.0,160.0 623.0,116.0 635.6,107.9 635.6,151.9" fill="#194931"/>
<text x="580.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">upper</text>
<polygon points="627.0,116.0 671.0,116.0 683.6,107.9 639.6,107.9" fill="#d28863"/>
<rect x="627.0" y="116.0" width="44.0" height="44.0" fill="#c05621"/>
<rect x="627.0" y="116.0" width="44.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="671.0,160.0 671.0,116.0 683.6,107.9 683.6,151.9" fill="#692f12"/>
<text x="649.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">ACK</text>
<polygon points="675.0,116.0 761.0,116.0 773.6,107.9 687.6,107.9" fill="#6da98b"/>
<rect x="675.0" y="116.0" width="86.0" height="44.0" fill="#2f855a"/>
<rect x="675.0" y="116.0" width="86.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="761.0,160.0 761.0,116.0 773.6,107.9 773.6,151.9" fill="#194931"/>
<text x="718.0" y="143.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">lower</text>
<polygon points="765.0,116.0 815.0,116.0 827.6,107.9 777.6,107.9" fill="#d28863"/>
<rect x="765.0" y="116.0" width="50.0" height="44.0" fill="#c05621"/>
<rect x="765.0" y="116.0" width="50.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="815.0,160.0 815.0,116.0 827.6,107.9 827.6,151.9" fill="#692f12"/>
<text x="790.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">NACK</text>
<polygon points="819.0,116.0 853.0,116.0 865.6,107.9 831.6,107.9" fill="#d28863"/>
<rect x="819.0" y="116.0" width="34.0" height="44.0" fill="#c05621"/>
<rect x="819.0" y="116.0" width="34.0" height="44.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="853.0,160.0 853.0,116.0 865.6,107.9 865.6,151.9" fill="#692f12"/>
<text x="836.0" y="143.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">P</text>
<rect x="250" y="210" width="18" height="18" rx="3" fill="#c05621"/>
<text x="276.0" y="224.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">sent by the controller (Arduino)</text>
<rect x="530" y="210" width="18" height="18" rx="3" fill="#2f855a"/>
<text x="556.0" y="224.0" font-size="12" fill="#e6e6e6" text-anchor="start" font-weight="normal">sent by the target (MCP9808)</text>
<text x="450.0" y="262.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">S = START, Sr = repeated START, P = STOP. Write the register number, then turn around and read two bytes.</text>
<text x="450.0" y="282.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">The final NACK tells the target the controller has all it wants.</text>
</svg>
