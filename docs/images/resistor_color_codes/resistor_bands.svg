<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A 3D resistor with four colour bands, red, red, brown and gold, labelled 2, 2, times 10 and plus or minus 5 percent, read left to right: 22 times 10 equals 220 ohms, plus or minus 5 percent</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f7657"/><stop offset="0.22" stop-color="#ebd7bd"/><stop offset="0.5" stop-color="#dcb787"/><stop offset="1" stop-color="#584936"/></linearGradient><linearGradient id="lead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#838a91"/><stop offset="0.22" stop-color="#e2e7ed"/><stop offset="0.5" stop-color="#cbd5e0"/><stop offset="1" stop-color="#515559"/></linearGradient><linearGradient id="band0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#942828"/><stop offset="0.22" stop-color="#f09494"/><stop offset="0.5" stop-color="#e53e3e"/><stop offset="1" stop-color="#5b1818"/></linearGradient><linearGradient id="band1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#942828"/><stop offset="0.22" stop-color="#f09494"/><stop offset="0.5" stop-color="#e53e3e"/><stop offset="1" stop-color="#5b1818"/></linearGradient><linearGradient id="band2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2c0c"/><stop offset="0.22" stop-color="#bf987d"/><stop offset="0.5" stop-color="#8b4513"/><stop offset="1" stop-color="#371b07"/></linearGradient><linearGradient id="band3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#897123"/><stop offset="0.22" stop-color="#e7d391"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#544616"/></linearGradient></defs>
