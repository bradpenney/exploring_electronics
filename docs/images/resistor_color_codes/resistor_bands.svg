<text x="250.0" y="102.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">2</text>
<line x1="250" y1="188" x2="250" y2="210" stroke="#a0aec0" stroke-dasharray="2 3"/>
<text x="250.0" y="228.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">1st digit</text>
<rect x="300" y="121.0" width="24" height="58" rx="3" fill="url(#band1)"/>
<text x="312.0" y="102.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">2</text>
<line x1="312" y1="188" x2="312" y2="210" stroke="#a0aec0" stroke-dasharray="2 3"/>
<text x="312.0" y="228.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">2nd digit</text>
<rect x="362" y="121.0" width="24" height="58" rx="3" fill="url(#band2)"/>
<text x="374.0" y="102.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">×10</text>
<line x1="374" y1="188" x2="374" y2="210" stroke="#a0aec0" stroke-dasharray="2 3"/>
<text x="374.0" y="228.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Multiplier</text>
<rect x="480" y="116.0" width="24" height="68" rx="3" fill="url(#band3)"/>
<text x="492.0" y="102.0" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="bold">±5%</text>
<line x1="492" y1="188" x2="492" y2="210" stroke="#a0aec0" stroke-dasharray="2 3"/>
<text x="492.0" y="228.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="normal">Tolerance</text>
<rect x="190" y="123" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
<line x1="230" y1="44" x2="460" y2="44" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="345.0" y="32.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Read left → right</text>
<text x="450.0" y="156.0" font-size="11" fill="#5c4426" text-anchor="middle" font-weight="normal" font-style="italic">gap</text>
<text x="340.0" y="286.0" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="bold">22 × 10 = 220 Ω ±5%</text>
</svg>
