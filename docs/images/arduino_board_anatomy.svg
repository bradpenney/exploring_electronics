<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="sans">
  <title>Simplified top-down diagram of an Arduino Uno: USB port, power jack, reset button, the ATmega328P microcontroller chip, the onboard LED, and the digital and power/analog pin headers</title>

  <!-- Board -->
  <rect x="80" y="80" width="520" height="200" rx="14" fill="#0f5c52" stroke="#0a3f38" stroke-width="3" />

  <!-- Top pin header (power / analog) -->
  <g fill="#e6e6e6">
    <rect x="320" y="64" width="8" height="16" />
    <rect x="338" y="64" width="8" height="16" />
    <rect x="356" y="64" width="8" height="16" />
    <rect x="374" y="64" width="8" height="16" />
    <rect x="392" y="64" width="8" height="16" />
    <rect x="410" y="64" width="8" height="16" />
    <rect x="428" y="64" width="8" height="16" />
    <rect x="446" y="64" width="8" height="16" />
  </g>
  <text x="387" y="48" text-anchor="middle" font-size="13" fill="#e6e6e6">Power / Analog Pins</text>

  <!-- Bottom pin header (digital) -->
  <g fill="#e6e6e6">
    <rect x="110" y="280" width="8" height="16" />
    <rect x="146" y="280" width="8" height="16" />
    <rect x="182" y="280" width="8" height="16" />
    <rect x="218" y="280" width="8" height="16" />
    <rect x="254" y="280" width="8" height="16" />
    <rect x="290" y="280" width="8" height="16" />
    <rect x="326" y="280" width="8" height="16" />
    <rect x="362" y="280" width="8" height="16" />
    <rect x="398" y="280" width="8" height="16" />
    <rect x="434" y="280" width="8" height="16" />
    <rect x="470" y="280" width="8" height="16" />
    <rect x="506" y="280" width="8" height="16" />
    <rect x="542" y="280" width="8" height="16" />
    <rect x="578" y="280" width="8" height="16" />
  </g>
  <text x="344" y="330" text-anchor="middle" font-size="13" fill="#e6e6e6">Digital Pins (0&#8211;13)</text>

  <!-- USB port -->
  <rect x="30" y="110" width="55" height="42" rx="4" fill="#c0c0c0" stroke="#888888" stroke-width="2" />
  <text x="57" y="170" text-anchor="middle" font-size="13" fill="#e6e6e6">USB</text>
  <text x="57" y="188" text-anchor="middle" font-size="11" fill="#cbd5e0">(power + code)</text>

  <!-- Power jack -->
  <circle cx="57" cy="225" r="20" fill="#1a1a1a" stroke="#555555" stroke-width="2" />
  <text x="57" y="262" text-anchor="middle" font-size="13" fill="#e6e6e6">Power Jack</text>
  <text x="57" y="278" text-anchor="middle" font-size="11" fill="#cbd5e0">(external power)</text>

  <!-- Reset button -->
  <circle cx="560" cy="110" r="11" fill="#cc3333" stroke="#7a1a1a" stroke-width="2" />
  <text x="560" y="92" text-anchor="middle" font-size="12" fill="#e6e6e6">Reset</text>

  <!-- Microcontroller chip -->
  <rect x="290" y="150" width="160" height="100" rx="6" fill="#1a1a1a" stroke="#000000" stroke-width="2" />
  <text x="370" y="195" text-anchor="middle" font-size="14" fill="#e6e6e6">ATmega328P</text>
  <text x="370" y="215" text-anchor="middle" font-size="11" fill="#cbd5e0">(the microcontroller)</text>

  <!-- Onboard LED -->
  <circle cx="590" cy="200" r="7" fill="#ffb300" stroke="#e6e6e6" stroke-width="1.5" />
  <text x="590" y="184" text-anchor="middle" font-size="12" fill="#ffb300">L</text>
  <text x="590" y="228" text-anchor="middle" font-size="11" fill="#cbd5e0">(onboard LED)</text>
</svg>
