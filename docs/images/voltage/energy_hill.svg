<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Voltage as height: a 9 volt battery lifts each coulomb of charge to a height worth 9 joules; the charges roll down a ramp through a glowing load that spends the energy, and return to the bottom at 0 joules per coulomb</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9f6607"/><stop offset="0.22" stop-color="#f9c978"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#623f04"/></linearGradient></defs>
<rect x="15" y="15" width="770" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A 9 V battery gives every coulomb 9 joules; the circuit takes them back</text>
<ellipse cx="135" cy="386" rx="60" ry="10" fill="#000" fill-opacity="0.4"/>
<rect x="85" y="130" width="100" height="250" rx="8" fill="url(#tower)"/>
<rect x="85" y="130" width="100" height="250" rx="8" fill="url(#gloss)" opacity="0.4"/>
<text x="135.0" y="170.0" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="bold">9 V</text>
<text x="135.0" y="196.0" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal">battery</text>
<line x1="166" y1="360" x2="166" y2="220" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="122.0" y="332.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">lifts each</text>
<text x="122.0" y="348.0" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">coulomb</text>
<polygon points="185.0,146.0 325.0,146.0 353.0,128.0 213.0,128.0" fill="#808895"/>
<rect x="185.0" y="146.0" width="140.0" height="14.0" fill="#4a5568"/>
<rect x="185.0" y="146.0" width="140.0" height="14.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="325.0,160.0 325.0,146.0 353.0,128.0 353.0,142.0" fill="#282e39"/>
<path d="M325,148 L600,340" stroke="#2d3748" stroke-width="22" stroke-linecap="round"/>
<path d="M325,148 L600,340" stroke="#4a5568" stroke-width="16" stroke-linecap="round"/>
<polygon points="185.0,368.0 655.0,368.0 683.0,350.0 213.0,350.0" fill="#6c737e"/>
<rect x="185.0" y="368.0" width="470.0" height="12.0" fill="#2d3748"/>
<rect x="185.0" y="368.0" width="470.0" height="12.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="655.0,380.0 655.0,368.0 683.0,350.0 683.0,362.0" fill="#181e27"/>
<circle cx="210.0" cy="134.0" r="22" fill="url(#glow)"/><circle cx="210.0" cy="134.0" r="10" fill="url(#vball)"/>
<circle cx="250.0" cy="134.0" r="22" fill="url(#glow)"/><circle cx="250.0" cy="134.0" r="10" fill="url(#vball)"/>
<circle cx="290.0" cy="134.0" r="22" fill="url(#glow)"/><circle cx="290.0" cy="134.0" r="10" fill="url(#vball)"/>
<circle cx="374.5" cy="168.6" r="22" fill="url(#glow)"/><circle cx="374.5" cy="168.6" r="10" fill="url(#vball)"/>
<circle cx="495.5" cy="253.0" r="22" fill="url(#glow)"/><circle cx="495.5" cy="253.0" r="10" fill="url(#vball)"/>
<circle cx="560.0" cy="354.0" r="22" fill="url(#glow)"/><circle cx="560.0" cy="354.0" r="10" fill="url(#vball)"/>
<circle cx="500.0" cy="354.0" r="22" fill="url(#glow)"/><circle cx="500.0" cy="354.0" r="10" fill="url(#vball)"/>
<circle cx="440.0" cy="354.0" r="22" fill="url(#glow)"/><circle cx="440.0" cy="354.0" r="10" fill="url(#vball)"/>
<circle cx="380.0" cy="354.0" r="22" fill="url(#glow)"/><circle cx="380.0" cy="354.0" r="10" fill="url(#vball)"/>
<circle cx="470" cy="210" r="44" fill="#fefcbf" fill-opacity="0.25"/>
<circle cx="470" cy="210" r="24" fill="url(#vball)"/>
<text x="510.0" y="180.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="normal" font-style="italic">the load spends the energy</text>
<text x="510.0" y="196.0" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="normal" font-style="italic">(light, heat, motion)</text>
<line x1="720" y1="146" x2="720" y2="380" stroke="#a0aec0" stroke-width="2"/>
<line x1="712" y1="146" x2="728" y2="146" stroke="#a0aec0" stroke-width="2"/>
<text x="712.0" y="138.0" font-size="12" fill="#e6e6e6" text-anchor="end" font-weight="bold">9 J per coulomb</text>
<line x1="712" y1="380" x2="728" y2="380" stroke="#a0aec0" stroke-width="2"/>
<text x="712.0" y="372.0" font-size="12" fill="#e6e6e6" text-anchor="end" font-weight="bold">0 J per coulomb</text>
<text x="400.0" y="432.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">height = voltage: energy per coulomb, not how many coulombs there are</text>
</svg>
