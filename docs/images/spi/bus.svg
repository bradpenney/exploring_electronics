<rect x="270.0" y="270.0" width="120.0" height="90.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="390.0,360.0 390.0,270.0 415.2,253.8 415.2,343.8" fill="#194931"/>
<text x="330.0" y="305.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">ADC</text>
<text x="330.0" y="325.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">selected</text>
<path d="M180,230 L370,230 L370,270" stroke="#fc8181" stroke-width="2.5" fill="none" stroke-dasharray="0"/>
<text x="376.0" y="226.0" font-size="10" fill="#fc8181" text-anchor="start" font-weight="bold">CS1 LOW</text>
<line x1="510" y1="110" x2="510" y2="270" stroke="#90cdf4" stroke-width="3" stroke-opacity="1"/>
<line x1="530" y1="140" x2="530" y2="270" stroke="#f59e0b" stroke-width="3" stroke-opacity="1"/>
