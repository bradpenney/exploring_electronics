<polygon points="470.0,270.0 590.0,270.0 615.2,253.8 495.2,253.8" fill="#808895"/>
<rect x="470.0" y="270.0" width="120.0" height="90.0" fill="#4a5568"/>
<rect x="470.0" y="270.0" width="120.0" height="90.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="590.0,360.0 590.0,270.0 615.2,253.8 615.2,343.8" fill="#282e39"/>
<text x="530.0" y="305.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">SD card</text>
<text x="530.0" y="325.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">CIPO let go</text>
<path d="M180,242 L570,242 L570,270" stroke="#a0aec0" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
<text x="576.0" y="238.0" font-size="10" fill="#a0aec0" text-anchor="start" font-weight="bold">CS2 HIGH</text>
<line x1="710" y1="110" x2="710" y2="270" stroke="#90cdf4" stroke-width="3" stroke-opacity="1"/>
<line x1="730" y1="140" x2="730" y2="270" stroke="#f59e0b" stroke-width="3" stroke-opacity="1"/>
<line x1="750" y1="170" x2="750" y2="270" stroke="#48bb78" stroke-width="3" stroke-opacity="0.35"/>
<ellipse cx="742.6" cy="365.0" rx="78.6" ry="6.5" fill="#000" fill-opacity="0.4"/>
<polygon points="670.0,270.0 790.0,270.0 815.2,253.8 695.2,253.8" fill="#808895"/>
<rect x="670.0" y="270.0" width="120.0" height="90.0" fill="#4a5568"/>
<rect x="670.0" y="270.0" width="120.0" height="90.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="790.0,360.0 790.0,270.0 815.2,253.8 815.2,343.8" fill="#282e39"/>
<text x="730.0" y="305.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">display</text>
<text x="730.0" y="325.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">CIPO let go</text>
<path d="M180,254 L770,254 L770,270" stroke="#a0aec0" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
<text x="776.0" y="250.0" font-size="10" fill="#a0aec0" text-anchor="start" font-weight="bold">CS3 HIGH</text>
<text x="450.0" y="400.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Only the peripheral whose CS is LOW listens and drives CIPO; the others ignore the clock.</text>
</svg>
