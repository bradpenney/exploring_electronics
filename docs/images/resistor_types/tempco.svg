<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two bars showing how far a 10 kilohm resistor's value can move when warmed by 30 degrees. A carbon film resistor rated minus 500 to plus 350 parts per million per degree can move from minus 150 to plus 105 ohms. A metal film resistor rated plus or minus 50 can move only 15 ohms either way.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="790" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A 10 kΩ resistor warmed by 30 °C: how far can its value move?</text>
<line x1="80" y1="200" x2="380" y2="200" stroke="#a0aec0"/>
<rect x="204" y="147.5" width="52" height="127.5" rx="6" fill="#f59e0b" fill-opacity="0.75"/>
<rect x="204" y="147.5" width="52" height="127.5" rx="6" fill="url(#gloss)"/>
<text x="270.0" y="152.5" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="bold">+105 Ω</text>
<text x="270.0" y="280.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="bold">-150 Ω</text>
<text x="80.0" y="194.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal">10 kΩ</text>
<text x="230.0" y="345.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Carbon film (CFR-25)</text>
<text x="230.0" y="366.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">-500 to +350 ppm/°C</text>
<line x1="440" y1="200" x2="740" y2="200" stroke="#a0aec0"/>
<rect x="564" y="192.5" width="52" height="15.0" rx="6" fill="#48bb78" fill-opacity="0.75"/>
<rect x="564" y="192.5" width="52" height="15.0" rx="6" fill="url(#gloss)"/>
<text x="630.0" y="197.5" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="bold">+15 Ω</text>
<text x="630.0" y="212.5" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="bold">-15 Ω</text>
<text x="440.0" y="194.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal">10 kΩ</text>
<text x="590.0" y="345.0" font-size="15" fill="#9ae6b4" text-anchor="middle" font-weight="bold">Metal film (MFR)</text>
<text x="590.0" y="366.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">-50 to +50 ppm/°C</text>
<text x="410.0" y="390.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">ppm/°C: parts per million of the value, per degree. 350 ppm/°C × 30 °C = 10,500 ppm ≈ 1%</text>
</svg>
