<polygon points="190.0,160.0 340.0,160.0 363.8,144.7 213.8,144.7" fill="#d28863"/>
<rect x="190.0" y="160.0" width="150.0" height="140.0" fill="#c05621"/>
<rect x="190.0" y="160.0" width="150.0" height="140.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="340.0,300.0 340.0,160.0 363.8,144.7 363.8,284.7" fill="#692f12"/>
<text x="265.0" y="215.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Processor</text>
<text x="265.0" y="245.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">runs the sketch, one</text>
<text x="265.0" y="261.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">instruction at a time</text>
<polygon points="370.0,160.0 520.0,160.0 543.8,144.7 393.8,144.7" fill="#6a98c7"/>
<rect x="370.0" y="160.0" width="150.0" height="140.0" fill="#2b6cb0"/>
<rect x="370.0" y="160.0" width="150.0" height="140.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="520.0,300.0 520.0,160.0 543.8,144.7 543.8,284.7" fill="#173b60"/>
<text x="445.0" y="215.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Flash: 32 KB</text>
<text x="445.0" y="245.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">the program; kept</text>
<text x="445.0" y="261.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">when power is off</text>
<polygon points="550.0,160.0 700.0,160.0 723.8,144.7 573.8,144.7" fill="#6da98b"/>
<rect x="550.0" y="160.0" width="150.0" height="140.0" fill="#2f855a"/>
<rect x="550.0" y="160.0" width="150.0" height="140.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="700.0,300.0 700.0,160.0 723.8,144.7 723.8,284.7" fill="#194931"/>
<text x="625.0" y="215.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">SRAM: 2 KB</text>
<text x="625.0" y="245.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">working data; lost</text>
<text x="625.0" y="261.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">when power is off</text>
<text x="450.0" y="404.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">pins: the chip's only connection to the outside world</text>
</svg>
