<text x="760.0" y="153.0" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="bold">860</text>
<line x1="250.0" y1="148.0" x2="375.0" y2="148.0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="530.0" y1="148.0" x2="655.0" y2="148.0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
