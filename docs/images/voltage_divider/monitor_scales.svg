<text x="422.0" y="164.0" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">4 V</text>
<text x="422.0" y="104.0" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">5 V</text>
<ellipse cx="737.0" cy="405.0" rx="31.0" ry="5.0" fill="#000" fill-opacity="0.4"/>
<polygon points="712.0,100.0 748.0,100.0 762.0,91.0 726.0,91.0" fill="#808895"/>
