<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two 3D stacks of two resistor blocks on a 9 volt scale. With nothing attached, R1 and R2 each take 4.5 volts and the output between them is 4.5 volts. With a 1 kilohm load across R2, the bottom block shrinks to 0.75 volts and R1 takes 8.25 volts, so the output falls to 0.75 volts.</title>
