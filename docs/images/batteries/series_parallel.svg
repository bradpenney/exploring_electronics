<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two pairs of 12 volt, 20 amp-hour batteries. Wired in series, positive of one to negative of the next, they make 24 volts at 20 amp-hours. Wired in parallel, positive to positive and negative to negative, they make 12 volts at 40 amp-hours.</title>
