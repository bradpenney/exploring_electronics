<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Four warning signs of a failing lithium-ion battery: it smells strange, feels hot, swells or bulges, or pops or hisses. Below, the response: move it away from anything that can burn and call the fire department; if it is already on fire, get everyone out, close the door, and call 9-1-1.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<text x="430.0" y="34.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A lithium-ion battery in trouble: stop using it if it…</text>
<rect x="20" y="55" width="190" height="190" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<circle cx="115" cy="135" r="46" fill="#c53030" fill-opacity="0.25" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="115.0" y="150.0" font-size="40" fill="#fc8181" text-anchor="middle" font-weight="bold">~</text>
<text x="115.0" y="218.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">smells strange</text>
<rect x="230" y="55" width="190" height="190" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<circle cx="325" cy="135" r="46" fill="#c53030" fill-opacity="0.25" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="325.0" y="150.0" font-size="40" fill="#fc8181" text-anchor="middle" font-weight="bold">♨</text>
<text x="325.0" y="218.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">feels hot</text>
<rect x="440" y="55" width="190" height="190" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<circle cx="535" cy="135" r="46" fill="#c53030" fill-opacity="0.25" stroke="#fc8181" stroke-opacity="0.7"/>
<rect x="501" y="108" width="68" height="54" rx="22" fill="#4a5568" stroke="#fc8181" stroke-width="2"/>
<text x="535.0" y="218.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">swells or bulges</text>
<rect x="650" y="55" width="190" height="190" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<circle cx="745" cy="135" r="46" fill="#c53030" fill-opacity="0.25" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="745.0" y="150.0" font-size="40" fill="#fc8181" text-anchor="middle" font-weight="bold">‼</text>
<text x="745.0" y="218.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">pops or hisses</text>
<rect x="70" y="270" width="720" height="86" rx="16" fill="#c53030" fill-opacity="0.85"/>
<rect x="70" y="270" width="720" height="86" rx="16" fill="url(#gloss)"/>
<text x="430.0" y="303.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Move it away from anything that can burn, and call the fire department.</text>
<text x="430.0" y="330.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">If it's already on fire: get everyone out, close the door behind you, and call 9-1-1.</text>
</svg>
