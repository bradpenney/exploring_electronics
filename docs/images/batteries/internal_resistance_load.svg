<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two AA cells under a 1 amp load. An alkaline cell with 150 to 300 milliohms of internal resistance loses 0.15 to 0.30 volts inside itself, leaving 1.20 to 1.35 volts. A charged NiMH cell with 30 milliohms loses only 0.03 volts, leaving 1.17 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="alk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9f6607"/><stop offset="0.22" stop-color="#f9c978"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#623f04"/></linearGradient><linearGradient id="nimh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#246844"/><stop offset="0.22" stop-color="#91cbac"/><stop offset="0.5" stop-color="#38a169"/><stop offset="1" stop-color="#16402a"/></linearGradient></defs>
<rect x="15" y="15" width="790" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Under a 1 A load, a cell loses I × R inside itself</text>
<rect x="190" y="110" width="60" height="140" rx="8" fill="url(#alk)"/>
<rect x="210" y="100" width="20" height="10" rx="2" fill="#cbd5e0"/>
<text x="220.0" y="190.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1.5 V</text>
<text x="220.0" y="82.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Alkaline AA</text>
<text x="220.0" y="284.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">internal resistance: 150–300 mΩ</text>
<text x="220.0" y="306.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">lost inside at 1 A: 0.15–0.30 V</text>
<text x="220.0" y="330.0" font-size="14" fill="#9ae6b4" text-anchor="middle" font-weight="bold">left for the load: 1.20–1.35 V</text>
<rect x="570" y="110" width="60" height="140" rx="8" fill="url(#nimh)"/>
<rect x="590" y="100" width="20" height="10" rx="2" fill="#cbd5e0"/>
<text x="600.0" y="190.0" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1.2 V</text>
<text x="600.0" y="82.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">NiMH AA (charged)</text>
<text x="600.0" y="284.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">internal resistance: 30 mΩ</text>
<text x="600.0" y="306.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="bold">lost inside at 1 A: 0.03 V</text>
<text x="600.0" y="330.0" font-size="14" fill="#9ae6b4" text-anchor="middle" font-weight="bold">left for the load: 1.17 V</text>
<text x="410.0" y="372.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">Lower internal resistance is why NiMH cells handle high-current loads well, even at a lower nominal voltage</text>
</svg>
