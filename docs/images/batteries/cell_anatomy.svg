<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A cut-open alkaline AA cell: a steel can that forms the positive terminal, a manganese dioxide cathode lining it, a separator, a zinc gel anode in the centre, and a brass collector carrying current down to the negative cap.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#68717c"/><stop offset="0.22" stop-color="#cad2dc"/><stop offset="0.5" stop-color="#a0aec0"/><stop offset="1" stop-color="#40454c"/></linearGradient><linearGradient id="mno2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d232e"/><stop offset="0.22" stop-color="#8b919a"/><stop offset="0.5" stop-color="#2d3748"/><stop offset="1" stop-color="#12161c"/></linearGradient><linearGradient id="zinc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#838a91"/><stop offset="0.22" stop-color="#e2e7ed"/><stop offset="0.5" stop-color="#cbd5e0"/><stop offset="1" stop-color="#515559"/></linearGradient></defs>
<rect x="15" y="15" width="770" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Inside an alkaline AA cell (cut open)</text>
<ellipse cx="260" cy="388" rx="80" ry="10" fill="#000" fill-opacity="0.4"/>
<rect x="190" y="90" width="140" height="290" rx="10" fill="url(#can)"/>
<rect x="202" y="104" width="116" height="262" rx="6" fill="url(#mno2)"/>
<rect x="226" y="116" width="68" height="238" rx="4" fill="#f7fafc" fill-opacity="0.85"/>
<rect x="230" y="120" width="60" height="230" rx="4" fill="url(#zinc)"/>
<rect x="256" y="150" width="8" height="240" fill="#d4af37"/>
<rect x="242" y="76" width="36" height="14" rx="3" fill="#cbd5e0"/>
<rect x="210" y="374" width="100" height="10" rx="3" fill="#718096"/>
<text x="260.0" y="68.0" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="bold">+</text>
<text x="260.0" y="410.0" font-size="22" fill="#90cdf4" text-anchor="middle" font-weight="bold">−</text>
<line x1="326" y1="120" x2="430" y2="120" stroke="#a0aec0" stroke-dasharray="3 3"/>
<circle cx="326" cy="120" r="3.5" fill="#f59e0b"/>
<text x="440.0" y="124.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">steel can: the + terminal</text>
<line x1="310" y1="170" x2="430" y2="170" stroke="#a0aec0" stroke-dasharray="3 3"/>
<circle cx="310" cy="170" r="3.5" fill="#f59e0b"/>
<text x="440.0" y="174.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">manganese dioxide: the cathode</text>
<line x1="292" y1="220" x2="430" y2="220" stroke="#a0aec0" stroke-dasharray="3 3"/>
<circle cx="292" cy="220" r="3.5" fill="#f59e0b"/>
<text x="440.0" y="224.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">separator: keeps them apart, lets ions through</text>
<line x1="282" y1="270" x2="430" y2="270" stroke="#a0aec0" stroke-dasharray="3 3"/>
<circle cx="282" cy="270" r="3.5" fill="#f59e0b"/>
<text x="440.0" y="274.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">zinc gel: the anode</text>
<line x1="264" y1="320" x2="430" y2="320" stroke="#a0aec0" stroke-dasharray="3 3"/>
<circle cx="264" cy="320" r="3.5" fill="#f59e0b"/>
<text x="440.0" y="324.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">brass collector: carries current to the − cap</text>
<text x="560.0" y="380.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the reaction pushes electrons from zinc to manganese dioxide</text>
<text x="560.0" y="398.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">through the outside circuit: about 1.5 V per cell</text>
</svg>
