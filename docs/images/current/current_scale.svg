<text x="205.6" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 mA</text>
<line x1="283.3" y1="198" x2="283.3" y2="204" stroke="#a0aec0"/>
<text x="283.3" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 mA</text>
