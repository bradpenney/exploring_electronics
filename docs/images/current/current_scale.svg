<text x="438.9" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 A</text>
<line x1="516.7" y1="198" x2="516.7" y2="204" stroke="#a0aec0"/>
<text x="516.7" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 A</text>
<line x1="594.4" y1="198" x2="594.4" y2="204" stroke="#a0aec0"/>
<text x="594.4" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">1 kA</text>
<line x1="672.2" y1="198" x2="672.2" y2="204" stroke="#a0aec0"/>
<text x="672.2" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">10 kA</text>
<line x1="750.0" y1="198" x2="750.0" y2="204" stroke="#a0aec0"/>
<text x="750.0" y="218.0" font-size="10" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 kA</text>
<circle cx="229.0" cy="184.0" r="8" fill="url(#eball)"/>
<line x1="229.0" y1="168" x2="229.0" y2="146" stroke="#a0aec0"/>
<text x="229.0" y="140.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">LED</text>
<circle cx="252.4" cy="184.0" r="8" fill="url(#eball)"/>
<line x1="252.4" y1="168" x2="252.4" y2="112" stroke="#a0aec0"/>
<text x="252.4" y="106.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Uno pin max</text>
<circle cx="337.7" cy="184.0" r="8" fill="url(#eball)"/>
<line x1="337.7" y1="168" x2="337.7" y2="146" stroke="#a0aec0"/>
<text x="337.7" y="140.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">USB 2.0 port</text>
<circle cx="452.6" cy="184.0" r="8" fill="url(#eball)"/>
<line x1="452.6" y1="168" x2="452.6" y2="112" stroke="#a0aec0"/>
<text x="452.6" y="106.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">household breaker</text>
<circle cx="709.3" cy="184.0" r="8" fill="url(#eball)"/>
<line x1="709.3" y1="168" x2="709.3" y2="146" stroke="#a0aec0"/>
<text x="709.3" y="140.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="bold">lightning</text>
<line x1="127.8" y1="224" x2="127.8" y2="236" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="127.8" y="250.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="bold">1 mA</text>
<text x="127.8" y="265.0" font-size="11" fill="#fc8181" text-anchor="middle" font-weight="normal">barely felt</text>
<line x1="225.4" y1="224" x2="225.4" y2="278" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="225.4" y="292.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="bold">16–20 mA</text>
<text x="225.4" y="307.0" font-size="11" fill="#fc8181" text-anchor="middle" font-weight="normal">can't let go; breathing stops</text>
<line x1="283.3" y1="224" x2="283.3" y2="236" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="283.3" y="250.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="bold">100 mA</text>
<text x="283.3" y="265.0" font-size="11" fill="#fc8181" text-anchor="middle" font-weight="normal">heart fibrillates</text>
<line x1="384.5" y1="224" x2="384.5" y2="278" stroke="#fc8181" stroke-opacity="0.7"/>
<text x="384.5" y="292.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="bold">2 A</text>
<text x="384.5" y="307.0" font-size="11" fill="#fc8181" text-anchor="middle" font-weight="normal">heart stops</text>
<text x="400.0" y="372.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">red zone: effects of 60 Hz current through the body (NIOSH 98-131, Table 1)</text>
</svg>
