<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels reducing a resistor network. First, a 100 ohm resistor in series with a 300 ohm and a 600 ohm resistor in parallel. Second, the parallel pair replaced by its equivalent, 200 ohms, from product over sum. Third, 100 plus 200 gives one 300 ohm resistor, and 9 volts across it drives 30 milliamps.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="sp-res" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b785b"/><stop offset="0.22" stop-color="#e8d8bf"/><stop offset="0.5" stop-color="#d6b98c"/><stop offset="1" stop-color="#554a38"/></linearGradient><linearGradient id="sp-resv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b785b"/><stop offset="0.22" stop-color="#e8d8bf"/><stop offset="0.5" stop-color="#d6b98c"/><stop offset="1" stop-color="#554a38"/></linearGradient></defs>
<rect x="15" y="15" width="280" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="155.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">1. As drawn</text>
<rect x="310" y="15" width="280" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">2. Combine the parallel pair</text>
<rect x="605" y="15" width="280" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="745.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">3. Add the series part</text>
<path d="M55,120 L75,120" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="75" y="109" width="70" height="22" rx="10" fill="url(#sp-res)"/>
<rect x="96.0" y="109" width="5" height="22" fill="#5a3a1a"/>
<rect x="106.5" y="109" width="5" height="22" fill="#5a3a1a"/>
<rect x="117.0" y="109" width="5" height="22" fill="#5a3a1a"/>
<text x="110.0" y="100.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 Ω</text>
<path d="M145,120 L215,120 M180,120 L180,150 M250,120 L250,150 M215,120 L250,120" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="169" y="150" width="22" height="80" rx="10" fill="url(#sp-resv)"/>
<rect x="169" y="174.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="169" y="186.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="169" y="198.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="239" y="150" width="22" height="80" rx="10" fill="url(#sp-resv)"/>
<rect x="239" y="174.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="239" y="186.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="239" y="198.0" width="22" height="5" fill="#5a3a1a"/>
<text x="155.0" y="195.0" font-size="13" fill="#e6e6e6" text-anchor="end" font-weight="bold">300 Ω</text>
<text x="275.0" y="195.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="bold">600 Ω</text>
<path d="M180,230 L180,260 L250,260 L250,230" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<text x="155.0" y="320.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">9 V across the whole network</text>
<path d="M350,120 L370,120" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="370" y="109" width="70" height="22" rx="10" fill="url(#sp-res)"/>
<rect x="391.0" y="109" width="5" height="22" fill="#5a3a1a"/>
<rect x="401.5" y="109" width="5" height="22" fill="#5a3a1a"/>
<rect x="412.0" y="109" width="5" height="22" fill="#5a3a1a"/>
<text x="405.0" y="100.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 Ω</text>
<path d="M440,120 L510,120 L510,150" stroke="#e6e6e6" stroke-width="3" fill="none"/>
<rect x="499" y="150" width="22" height="80" rx="10" fill="url(#sp-resv)"/>
<rect x="499" y="174.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="499" y="186.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="499" y="198.0" width="22" height="5" fill="#5a3a1a"/>
<text x="532.0" y="195.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="bold">200 Ω</text>
<text x="450.0" y="300.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">300 × 600 ÷ (300 + 600) = 200 Ω</text>
<text x="450.0" y="320.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">product over sum</text>
<rect x="699" y="110" width="22" height="110" rx="10" fill="url(#sp-resv)"/>
<rect x="699" y="143.0" width="22" height="5" fill="#5a3a1a"/>
<rect x="699" y="159.5" width="22" height="5" fill="#5a3a1a"/>
<rect x="699" y="176.0" width="22" height="5" fill="#5a3a1a"/>
<text x="732.0" y="170.0" font-size="14" fill="#e6e6e6" text-anchor="start" font-weight="bold">300 Ω</text>
<text x="745.0" y="270.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">100 + 200 = 300 Ω</text>
<rect x="652.5" y="295.0" width="185" height="30" rx="15.0" fill="#48bb78"/>
<rect x="652.5" y="295.0" width="185" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="745.0" y="314.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">9 V ÷ 300 Ω = 30 mA</text>
</svg>
