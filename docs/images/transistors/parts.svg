<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three transistor packages with pin labels. A P2N2222A NPN in a black TO-92, pins collector, base, emitter. An IRLZ44N MOSFET in a TO-220 with a metal tab, pins gate, drain, source. And a tiny surface-mount SOT-23. Pin orders differ between parts, so always check the datasheet.</title>
