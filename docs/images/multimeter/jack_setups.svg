<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three panels of a four-jack meter: A, mA, COM and V-ohms. For volts, ohms, continuity and diode tests, the black lead goes in COM and the red in V-ohms. For small currents the red lead moves to mA, which has a small fuse. For currents up to 10 amps it moves to A, which has a large fuse. The black lead stays in COM every time.</title>
