<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three meter displays reading the same 9.27 volt battery on a 6,000-count meter. On the 6 volt range the display shows OL for overload. On the 60 volt range it shows 9.27, the range auto-ranging picks. On the 600 volt range it shows 9.3, which fits but loses a digit.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="280" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="155.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">6.000 V range</text>
<rect x="45" y="90" width="220" height="90" rx="6" fill="#9fb59a"/>
<rect x="49" y="94" width="212" height="82" rx="4" fill="#b8ccb2"/>
<text x="251" y="154.8" font-size="54" fill="#1f2a1d" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-weight="bold">OL</text>
<text x="55" y="108" font-size="11" fill="#1f2a1d" font-weight="bold">DC V</text>
<rect x="62.5" y="215.0" width="185" height="30" rx="15.0" fill="#fc8181"/>
<rect x="62.5" y="215.0" width="185" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="155.0" y="234.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">too small: overload</text>
<rect x="310" y="15" width="280" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">60.00 V range</text>
<rect x="340" y="90" width="220" height="90" rx="6" fill="#9fb59a"/>
<rect x="344" y="94" width="212" height="82" rx="4" fill="#b8ccb2"/>
<text x="546" y="154.8" font-size="54" fill="#1f2a1d" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-weight="bold">9.27</text>
<text x="350" y="108" font-size="11" fill="#1f2a1d" font-weight="bold">DC V</text>
<rect x="325.5" y="215.0" width="249" height="30" rx="15.0" fill="#48bb78"/>
<rect x="325.5" y="215.0" width="249" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="450.0" y="234.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">auto-ranging picks this one</text>
<rect x="605" y="15" width="280" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="745.0" y="50.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">600.0 V range</text>
<rect x="635" y="90" width="220" height="90" rx="6" fill="#9fb59a"/>
<rect x="639" y="94" width="212" height="82" rx="4" fill="#b8ccb2"/>
<text x="841" y="154.8" font-size="54" fill="#1f2a1d" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-weight="bold">9.3</text>
<text x="645" y="108" font-size="11" fill="#1f2a1d" font-weight="bold">DC V</text>
<rect x="632.5" y="215.0" width="225" height="30" rx="15.0" fill="#f59e0b"/>
<rect x="632.5" y="215.0" width="225" height="30" rx="15.0" fill="url(#gloss)"/>
<text x="745.0" y="234.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">fits, but one digit lost</text>
<text x="450.0" y="300.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the same 9.27 V battery on a 6,000-count meter's three ranges</text>
</svg>
