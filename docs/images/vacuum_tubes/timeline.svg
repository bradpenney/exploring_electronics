<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A timeline from 1880 to 1950. 1883, the Edison effect: current from a hot filament. 1904, the Fleming valve, the vacuum diode. 1907, de Forest's Audion triode patent. 1947, RCA releases the 12AX7, and Bell Labs demonstrates the first transistor in December.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="300" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">From a curiosity in a light bulb to the transistor</text>
<rect x="90" y="175" width="720" height="10" rx="5" fill="#4a5568"/>
<line x1="90.0" y1="188" x2="90.0" y2="196" stroke="#a0aec0"/>
<text x="90.0" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1880</text>
<line x1="192.9" y1="188" x2="192.9" y2="196" stroke="#a0aec0"/>
<text x="192.9" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1890</text>
<line x1="295.7" y1="188" x2="295.7" y2="196" stroke="#a0aec0"/>
<text x="295.7" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1900</text>
<line x1="398.6" y1="188" x2="398.6" y2="196" stroke="#a0aec0"/>
<text x="398.6" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1910</text>
<line x1="501.4" y1="188" x2="501.4" y2="196" stroke="#a0aec0"/>
<text x="501.4" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1920</text>
<line x1="604.3" y1="188" x2="604.3" y2="196" stroke="#a0aec0"/>
<text x="604.3" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1930</text>
<line x1="707.1" y1="188" x2="707.1" y2="196" stroke="#a0aec0"/>
<text x="707.1" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1940</text>
<line x1="810.0" y1="188" x2="810.0" y2="196" stroke="#a0aec0"/>
<text x="810.0" y="212.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">1950</text>
<line x1="120.9" y1="180" x2="120.9" y2="132" stroke="#fbbf24" stroke-width="2"/>
<circle cx="120.9" cy="180" r="9" fill="url(#vball)"/>
<rect x="28.4" y="94.0" width="185" height="32" rx="16.0" fill="#c05621"/>
<rect x="28.4" y="94.0" width="185" height="32" rx="16.0" fill="url(#gloss)"/>
<text x="120.9" y="114.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1883: Edison effect</text>
<text x="120.9" y="86.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">current from a hot filament</text>
<line x1="336.9" y1="180" x2="336.9" y2="243" stroke="#fbbf24" stroke-width="2"/>
<circle cx="336.9" cy="180" r="9" fill="url(#vball)"/>
<rect x="244.4" y="249.0" width="185" height="32" rx="16.0" fill="#c05621"/>
<rect x="244.4" y="249.0" width="185" height="32" rx="16.0" fill="url(#gloss)"/>
<text x="336.9" y="269.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1904: Fleming valve</text>
<text x="336.9" y="299.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the vacuum diode</text>
<line x1="367.7" y1="180" x2="367.7" y2="132" stroke="#fbbf24" stroke-width="2"/>
<circle cx="367.7" cy="180" r="9" fill="url(#vball)"/>
<rect x="275.2" y="94.0" width="185" height="32" rx="16.0" fill="#c05621"/>
<rect x="275.2" y="94.0" width="185" height="32" rx="16.0" fill="url(#gloss)"/>
<text x="367.7" y="114.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1907: Audion patent</text>
<text x="367.7" y="86.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">de Forest's triode</text>
<line x1="779.1" y1="180" x2="779.1" y2="243" stroke="#fbbf24" stroke-width="2"/>
<circle cx="779.1" cy="180" r="9" fill="url(#vball)"/>
<rect x="682.6" y="249.0" width="193" height="32" rx="16.0" fill="#c05621"/>
<rect x="682.6" y="249.0" width="193" height="32" rx="16.0" fill="url(#gloss)"/>
<text x="779.1" y="269.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1947: 12AX7 released</text>
<text x="779.1" y="299.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">and the transistor, Dec 1947</text>
</svg>
