<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" style="max-width:100%;height:auto" role="group" aria-labelledby="cf-title cf-desc" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title id="cf-title">Circuit Foundations reading order, as a transit map</title>
<desc id="cf-desc">One line snaking through fourteen stops in five stages. What electricity is made of: Conductors, What Is Electricity?, Prefixes; The three quantities: Voltage, Current, Resistance; Putting them to work: Ohm's Law and Power, Opens, Shorts, and Fuses; Beyond steady DC: AC vs DC, Magnetism; Combining and storing: Series and Parallel, Voltage Dividers, Capacitors, Inductors. Every stop is a link to its article.</desc>
<style>.tm-stop .tm-ring{stroke:#1a202c;stroke-width:3;transition:stroke .15s}.tm-stop:hover .tm-ring,.tm-stop:focus-visible .tm-ring{stroke:#ffffff;stroke-width:4}.tm-stop:hover .tm-lbl,.tm-stop:focus-visible .tm-lbl{fill:#ffffff;text-decoration:underline}.tm-stop:focus{outline:none}</style>
