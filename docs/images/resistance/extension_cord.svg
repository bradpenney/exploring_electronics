<rect x="612" y="243" width="116" height="20" fill="url(#coilglow)"/>
<line x1="616" y1="253" x2="724" y2="253" stroke="#fc8181" stroke-width="4" stroke-linecap="round"/>
<rect x="575.0" y="324.0" width="190" height="32" rx="16.0" fill="#2d3748"/>
<rect x="575.0" y="324.0" width="190" height="32" rx="16.0" fill="url(#gloss)"/>
<text x="670.0" y="344.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">110.4 V at the heater</text>
<text x="400.0" y="430.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">1,500 W heater draws 12.5 A; the cord takes 9.6 V of the 120 V before the heater gets any</text>
</svg>
