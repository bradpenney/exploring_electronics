<path d="M130,240 C210,240 200,120 290,120 S380,320 460,300 S540,110 600,170" fill="none" stroke="#9c4221" stroke-width="15" stroke-linecap="round"/>
<path d="M130,240 C210,240 200,120 290,120 S380,320 460,300 S540,110 600,170" fill="none" stroke="#f6ad55" stroke-width="10" stroke-linecap="round"/>
<path d="M130,240 C210,240 200,120 290,120 S380,320 460,300 S540,110 600,170" fill="none" stroke="#fefcbf" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" transform="translate(-1,-3)"/>
<text x="400.0" y="382.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">30 m of 16-gauge cord: 0.77 Ω</text>
<text x="400.0" y="402.0" font-size="13" fill="#fc8181" text-anchor="middle" font-weight="normal">it warms by 120 W along its whole length</text>
<ellipse cx="684.0" cy="305.0" rx="90.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="600.0,150.0 740.0,150.0 768.0,132.0 628.0,132.0" fill="#808895"/>
