<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A 12 volt amber column on the left and a 5 volt green column on the right, with a glowing red pass transistor between them that drops the 7 volt difference as heat. A dashed feedback loop from the output back to the transistor compares the output with a fixed reference and opens or closes the transistor to hold it at 5 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">A linear regulator: a transistor that soaks up the difference</text>
<ellipse cx="152.5" cy="335.0" rx="68.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="90.0,90.0 180.0,90.0 215.0,67.5 125.0,67.5" fill="#f8bb54"/>
<rect x="90.0" y="90.0" width="90.0" height="240.0" fill="#f59e0b"/>
<rect x="90.0" y="90.0" width="90.0" height="240.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="180.0,330.0 180.0,90.0 215.0,67.5 215.0,307.5" fill="#865606"/>
<text x="135.0" y="64.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">12 V in</text>
<ellipse cx="702.5" cy="335.0" rx="68.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="640.0,230.0 730.0,230.0 765.0,207.5 675.0,207.5" fill="#7ecfa0"/>
<rect x="640.0" y="230.0" width="90.0" height="100.0" fill="#48bb78"/>
<rect x="640.0" y="230.0" width="90.0" height="100.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="730.0,330.0 730.0,230.0 765.0,207.5 765.0,307.5" fill="#276642"/>
<text x="685.0" y="204.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5 V out</text>
<ellipse cx="410" cy="190" rx="110" ry="70" fill="url(#glow)"/>
<ellipse cx="427.5" cy="245.0" rx="83.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="350.0,140.0 470.0,140.0 505.0,117.5 385.0,117.5" fill="#d66e6e"/>
<rect x="350.0" y="140.0" width="120.0" height="100.0" fill="#c53030"/>
<rect x="350.0" y="140.0" width="120.0" height="100.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="470.0,240.0 470.0,140.0 505.0,117.5 505.0,217.5" fill="#6c1a1a"/>
<text x="410.0" y="185.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">pass</text>
<text x="410.0" y="203.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">transistor</text>
<text x="410.0" y="222.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">drops 7 V</text>
<path d="M190,190 L345,190" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M505,190 L630,220" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M685,345 C685,395 410,395 410,300" stroke="#90cdf4" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="548.0" y="408.0" font-size="12" fill="#90cdf4" text-anchor="middle" font-weight="normal" font-style="italic">feedback: compare the output with a fixed reference, open or close the pass transistor</text>
</svg>
