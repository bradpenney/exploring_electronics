<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two stacked 3D bars for making 5 volts at 3 amps from 12 volts. A linear regulator takes in 36 watts: 15 go to the load and 21 become heat, 42 percent efficient, drawing the full 3 amps from the supply. The LM2596 switching regulator takes in 18.75 watts: 15 to the load and 3.75 as heat, 80 percent efficient, drawing only 1.56 amps.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="425" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<rect x="460" y="15" width="425" height="440" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="227.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Linear regulator</text>
<text x="227.0" y="72.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">12 V in, 5 V at 3 A out</text>
<ellipse cx="229.5" cy="385.0" rx="68.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="167.0,275.0 257.0,275.0 292.0,252.5 202.0,252.5" fill="#7ecfa0"/>
<rect x="167.0" y="275.0" width="90.0" height="105.0" fill="#48bb78"/>
<rect x="167.0" y="275.0" width="90.0" height="105.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="257.0,380.0 257.0,275.0 292.0,252.5 292.0,357.5" fill="#276642"/>
<polygon points="167.0,128.0 257.0,128.0 292.0,105.5 202.0,105.5" fill="#fca6a6"/>
<rect x="167.0" y="128.0" width="90.0" height="147.0" fill="#fc8181"/>
<rect x="167.0" y="128.0" width="90.0" height="147.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="257.0,275.0 257.0,128.0 292.0,105.5 292.0,252.5" fill="#8a4646"/>
<text x="212.0" y="332.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">15 W</text>
<text x="212.0" y="349.5" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">to the load</text>
<text x="212.0" y="206.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">21 W</text>
<text x="212.0" y="223.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">as heat</text>
<text x="227.0" y="102.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">36 W in</text>
<text x="227.0" y="414.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">draws 3.00 A from the 12 V supply</text>
<text x="227.0" y="432.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">42% efficient</text>
<text x="672.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Switching regulator (LM2596)</text>
<text x="672.0" y="72.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">12 V in, 5 V at 3 A out</text>
<ellipse cx="674.5" cy="385.0" rx="68.5" ry="9.0" fill="#000" fill-opacity="0.4"/>
<polygon points="612.0,275.0 702.0,275.0 737.0,252.5 647.0,252.5" fill="#7ecfa0"/>
<rect x="612.0" y="275.0" width="90.0" height="105.0" fill="#48bb78"/>
<rect x="612.0" y="275.0" width="90.0" height="105.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="702.0,380.0 702.0,275.0 737.0,252.5 737.0,357.5" fill="#276642"/>
<polygon points="612.0,248.8 702.0,248.8 737.0,226.2 647.0,226.2" fill="#fca6a6"/>
