<polygon points="702.0,275.0 702.0,248.8 737.0,226.2 737.0,252.5" fill="#8a4646"/>
<text x="657.0" y="332.5" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">15 W</text>
<text x="657.0" y="349.5" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal">to the load</text>
<text x="762.0" y="266.9" font-size="13" fill="#fc8181" text-anchor="start" font-weight="bold">3.75 W as heat</text>
<text x="672.0" y="222.8" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">18.75 W in</text>
<text x="672.0" y="414.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">draws 1.56 A from the 12 V supply</text>
<text x="672.0" y="432.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">80% efficient</text>
</svg>
