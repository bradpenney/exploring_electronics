<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Four 3D blocks in a row, each with the waveform it produces drawn above it. The transformer steps the mains voltage down and isolates it: a smaller sine wave. The rectifier turns it into one-way pulses: a row of humps. The filter capacitor smooths the pulses: a high line with a small ripple. The regulator, which needs a heat sink, holds the output perfectly steady: a flat line.</title>
