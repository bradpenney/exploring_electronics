<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three 3D silicon blocks, P-type in red with holes and N-type in blue with free electrons, separated by a grey depletion zone. With no voltage the zone is thin. Forward biased, positive on the P side, the zone is squeezed almost away and current flows from P to N. Reverse biased, the zone widens and almost nothing flows.</title>
