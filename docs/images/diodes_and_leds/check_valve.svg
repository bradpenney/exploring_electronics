<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A diode as a check valve in a pipe. Left: flow pushing forward swings a spring-loaded flap open once the push beats the spring, the forward voltage. Right: flow pushing backward presses the flap shut, and nothing flows until something breaks.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#495361"/><stop offset="0.22" stop-color="#b0b9c5"/><stop offset="0.5" stop-color="#718096"/><stop offset="1" stop-color="#2d333c"/></linearGradient></defs>
<rect x="20" y="20" width="400" height="340" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="220.0" y="52.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Push forward: the flap opens</text>
<rect x="50" y="146" width="340" height="68" rx="10" fill="url(#pipe)" fill-opacity="0.5"/>
<rect x="216" y="140" width="8" height="12" fill="#2d3748"/>
<line x1="220" y1="150" x2="266" y2="176" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
<line x1="80" y1="194" x2="130" y2="194" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="160" y1="194" x2="210" y2="194" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="240" y1="194" x2="290" y2="194" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320" y1="194" x2="370" y2="194" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="220.0" y="260.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">once the push beats the spring</text>
<text x="220.0" y="280.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">(the forward voltage)</text>
<text x="220.0" y="330.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">anode side → cathode side</text>
<rect x="440" y="20" width="400" height="340" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="640.0" y="52.0" font-size="15" fill="#fc8181" text-anchor="middle" font-weight="bold">Push backward: the flap seals</text>
<rect x="470" y="146" width="340" height="68" rx="10" fill="url(#pipe)" fill-opacity="0.5"/>
<rect x="636" y="140" width="8" height="12" fill="#2d3748"/>
<line x1="640" y1="150" x2="640" y2="210" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
<line x1="770" y1="194" x2="670" y2="194" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="640.0" y="260.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">no flow, however hard you push</text>
<text x="640.0" y="280.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">(until something breaks: breakdown)</text>
<text x="640.0" y="330.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">cathode side → anode side</text>
</svg>
