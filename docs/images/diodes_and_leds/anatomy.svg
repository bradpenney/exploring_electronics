<text x="110.0" y="234.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">anode</text>
<text x="320.0" y="234.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">cathode</text>
