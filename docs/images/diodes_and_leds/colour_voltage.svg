<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three LEDs placed along a visible spectrum. Blue at 465 nanometres: photon energy 2.67 electron-volts, forward voltage 3.3 volts. Green at 568: 2.18 electron-volts, 2.2 volts. Red at 640: 1.94 electron-volts, 1.85 volts. Bluer light carries more energy per photon and needs a higher forward voltage.</title>
