<title>Three ways to wire three red LEDs. Left, each LED with its own resistor: correct. Middle, three LEDs in series with one resistor: correct, one current through all of them. Right, three LEDs in parallel sharing one resistor: wrong, the LED with the lowest forward voltage takes most of the current and glows brightest.</title>
