<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A transformer: a square iron core with a primary coil of many turns on the left, fed 120 volts AC, and a secondary coil of one tenth as many turns on the right, delivering 12 volts AC. The changing field circulates through the core.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="790" height="390" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="46.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A transformer: two coils on one iron core, voltage set by the turns ratio</text>
<rect x="230" y="100" width="360" height="230" rx="10" fill="#4a5568"/>
<rect x="276" y="146" width="268" height="138" rx="6" fill="#1e2128"/>
<rect x="230" y="100" width="360" height="230" rx="10" fill="url(#gloss)" opacity="0.5"/>
<ellipse cx="253.0" cy="130" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="147" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="164" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="181" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="198" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="215" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="232" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="249" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="266" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="253.0" cy="283" rx="36" ry="7" fill="none" stroke="#c8733c" stroke-width="4"/>
<ellipse cx="567.0" cy="185" rx="36" ry="8" fill="none" stroke="#e8a07a" stroke-width="6"/>
<ellipse cx="567.0" cy="207" rx="36" ry="8" fill="none" stroke="#e8a07a" stroke-width="6"/>
<ellipse cx="567.0" cy="229" rx="36" ry="8" fill="none" stroke="#e8a07a" stroke-width="6"/>
<path d="M300,123.0 L520,123.0" stroke="#90cdf4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="410.0" y="113.0" font-size="11" fill="#90cdf4" text-anchor="middle" font-weight="normal" font-style="italic">changing field circulates in the core</text>
<rect x="35.0" y="197.0" width="150" height="36" rx="18.0" fill="#d97706"/>
<rect x="35.0" y="197.0" width="150" height="36" rx="18.0" fill="url(#gloss)"/>
<text x="110.0" y="220.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">120 V AC in</text>
<text x="110.0" y="250.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">primary: many turns</text>
<rect x="635.0" y="197.0" width="150" height="36" rx="18.0" fill="#2f855a"/>
<rect x="635.0" y="197.0" width="150" height="36" rx="18.0" fill="url(#gloss)"/>
<text x="710.0" y="220.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">12 V AC out</text>
<text x="710.0" y="250.0" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="normal">secondary: 1/10 as many</text>
<text x="410.0" y="370.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">Vout ÷ Vin = turns out ÷ turns in: a 10 : 1 ratio turns 120 V into 12 V</text>
<text x="410.0" y="392.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">only a changing current makes a changing field, so transformers work on AC, not steady DC</text>
</svg>
