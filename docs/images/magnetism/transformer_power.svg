<polygon points="177.0,330.0 177.0,140.0 198.0,126.5 198.0,316.5" fill="#24547b"/>
<text x="142.0" y="118.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">120 V</text>
<ellipse cx="282.5" cy="335.0" rx="51.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="237.0,311.0 307.0,311.0 328.0,297.5 258.0,297.5" fill="#f8bb54"/>
