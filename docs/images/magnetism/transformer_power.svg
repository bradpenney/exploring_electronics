<text x="272.0" y="354.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">current</text>
<text x="227.0" y="382.0" font-size="14" fill="#48bb78" text-anchor="middle" font-weight="bold">120 V × 0.5 A = 60 W</text>
<text x="227.0" y="402.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">looks like 240 Ω</text>
<text x="672.0" y="50.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Secondary</text>
<ellipse cx="597.5" cy="335.0" rx="51.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="552.0,311.0 622.0,311.0 643.0,297.5 573.0,297.5" fill="#7ab7ea"/>
<rect x="552.0" y="311.0" width="70.0" height="19.0" fill="#4299e1"/>
<rect x="552.0" y="311.0" width="70.0" height="19.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="622.0,330.0 622.0,311.0 643.0,297.5 643.0,316.5" fill="#24547b"/>
<text x="587.0" y="289.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">12 V</text>
<ellipse cx="727.5" cy="335.0" rx="51.5" ry="5.4" fill="#000" fill-opacity="0.4"/>
<polygon points="682.0,140.0 752.0,140.0 773.0,126.5 703.0,126.5" fill="#f8bb54"/>
<rect x="682.0" y="140.0" width="70.0" height="190.0" fill="#f59e0b"/>
<rect x="682.0" y="140.0" width="70.0" height="190.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="752.0,330.0 752.0,140.0 773.0,126.5 773.0,316.5" fill="#865606"/>
<text x="717.0" y="118.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">5 A</text>
<text x="587.0" y="354.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">voltage</text>
<text x="717.0" y="354.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">current</text>
<text x="672.0" y="382.0" font-size="14" fill="#48bb78" text-anchor="middle" font-weight="bold">12 V × 5 A = 60 W</text>
<text x="672.0" y="402.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">looks like 2.4 Ω</text>
<text x="450.0" y="452.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">10 : 1 turns: voltage down ten times, current up ten times, power the same</text>
</svg>
