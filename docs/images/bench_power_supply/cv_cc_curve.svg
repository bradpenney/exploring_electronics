<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A voltage against current graph with the supply's boundary: a horizontal line at 5 volts out to 100 milliamps, then a vertical line down at 100 milliamps. Three dashed load lines from the origin meet it: a 100 ohm load at 5 volts and 50 milliamps in constant voltage; a 50 ohm load at the corner, the crossover, 5 volts and 100 milliamps; a 20 ohm load at 2 volts and 100 milliamps in constant current.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="870" height="470" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="450.0" y="48.0" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="bold">Set 5 V and a 100 mA limit: the output lives on the amber boundary</text>
<line x1="110" y1="347.1" x2="820" y2="347.1" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="351.1" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">1 V</text>
<line x1="110" y1="304.3" x2="820" y2="304.3" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="308.3" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">2 V</text>
<line x1="110" y1="261.4" x2="820" y2="261.4" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="265.4" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">3 V</text>
<line x1="110" y1="218.6" x2="820" y2="218.6" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="222.6" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">4 V</text>
<line x1="110" y1="175.7" x2="820" y2="175.7" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="179.7" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">5 V</text>
<line x1="110" y1="132.9" x2="820" y2="132.9" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="136.9" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">6 V</text>
<line x1="110" y1="390" x2="820" y2="390" stroke="#a0aec0" stroke-width="1.5"/>
<line x1="110" y1="90" x2="110" y2="390" stroke="#a0aec0" stroke-width="1.5"/>
<text x="465.0" y="412.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal"></text>
<text x="110.0" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">0 mA</text>
<text x="228.3" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">25 mA</text>
<text x="346.7" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">50 mA</text>
<text x="465.0" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">75 mA</text>
<text x="583.3" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">100 mA</text>
<text x="701.7" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">125 mA</text>
<text x="820.0" y="410.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal">150 mA</text>
<text x="465.0" y="432.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">output current</text>
<polyline points="110.0,175.7 583.3,175.7 583.3,390.0" fill="none" stroke="#f6ad55" stroke-width="4" stroke-linejoin="round" filter="url(#softglow)"/>
<text x="124.2" y="197.7" font-size="13" fill="#48bb78" text-anchor="start" font-weight="bold">CV: voltage held at 5 V</text>
<text x="593.3" y="278.6" font-size="13" fill="#f6ad55" text-anchor="start" font-weight="bold">CC: current held at 100 mA</text>
<line x1="110.0" y1="390.0" x2="441.3" y2="90.0" stroke="#90cdf4" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="346.7" cy="175.7" r="7" fill="#90cdf4"/>
<text x="358.7" y="199.7" font-size="12" fill="#90cdf4" text-anchor="start" font-weight="bold">100 Ω: 5 V, 50 mA, CV</text>
<line x1="110.0" y1="390.0" x2="772.7" y2="90.0" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="583.3" cy="175.7" r="7" fill="#fbbf24"/>
<text x="573.3" y="141.7" font-size="12" fill="#fbbf24" text-anchor="end" font-weight="bold">50 Ω: 5 V, 100 mA (crossover)</text>
<line x1="110.0" y1="390.0" x2="820.0" y2="261.4" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="583.3" cy="304.3" r="7" fill="#fc8181"/>
<text x="595.3" y="328.3" font-size="12" fill="#fc8181" text-anchor="start" font-weight="bold">20 Ω: 2 V, 100 mA, CC</text>
<text x="465.0" y="462.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">dashed lines: each load's own V = I × R. The output sits where the load line meets the boundary.</text>
</svg>
