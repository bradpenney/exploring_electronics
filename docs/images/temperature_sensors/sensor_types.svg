<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three temperature sensors: a bead thermistor whose resistance changes, an MCP9700A analog IC whose voltage changes linearly, and a DS18B20 digital IC that sends a number over a data wire</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><radialGradient id="bead" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fbd38d"/><stop offset="0.5" stop-color="#b7791f"/><stop offset="1" stop-color="#4a2c0a"/></radialGradient></defs>
<text x="390.0" y="34.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Temperature in: three ways to get it out</text>
<rect x="15" y="52" width="240" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="135.0" y="82.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Thermistor</text>
<ellipse cx="135" cy="234" rx="30" ry="6" fill="#000" fill-opacity="0.4"/>
<path d="M127,230 L127,160 Q127,148 131.8,142" fill="none" stroke="#cbd5e0" stroke-width="3"/>
<path d="M143,230 L143,160 Q143,148 138.2,142" fill="none" stroke="#cbd5e0" stroke-width="3"/>
<ellipse cx="135" cy="130" rx="20" ry="16" fill="url(#bead)"/>
<path d="M85,300 A50,50 0 0 1 185,300" fill="none" stroke="#4a5568" stroke-width="10" stroke-linecap="round"/>
<path d="M85,300 A50,50 0 0 1 155,253" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
<text x="135.0" y="296.0" font-size="20" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Ω</text>
<text x="135.0" y="360.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">resistance changes</text>
<text x="135.0" y="380.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">steeply and non-linearly</text>
<text x="135.0" y="420.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">you build a divider and do the maths</text>
<rect x="270" y="52" width="240" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="390.0" y="82.0" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="bold">Analog IC (MCP9700A)</text>
<linearGradient id="to92390" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5568"/><stop offset="0.3" stop-color="#718096"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<ellipse cx="390" cy="234" rx="34" ry="6" fill="#000" fill-opacity="0.4"/>
<rect x="376" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="376" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<rect x="388" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="388" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<rect x="400" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="400" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<path d="M366,172 L366,120 A24,10 0 0 1 414,120 L414,172 A24,10 0 0 1 366,172 Z" fill="url(#to92390)"/>
<ellipse cx="390" cy="120" rx="24" ry="10" fill="#2d3748"/>
<rect x="366" y="130" width="48" height="38" fill="url(#gloss)" opacity="0.5"/>
<text x="390.0" y="150.0" font-size="9" fill="#cbd5e0" text-anchor="middle" font-weight="bold">9700A</text>
<polyline points="335,310 346,304 357,298 368,292 379,286 390,280 401,274 412,268 423,262 434,256 445,250" fill="none" stroke="#48bb78" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="315" x2="450" y2="315" stroke="#4a5568" stroke-width="2"/>
<text x="454.0" y="262.0" font-size="14" fill="#48bb78" text-anchor="start" font-weight="bold">V</text>
<text x="390.0" y="360.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">voltage changes</text>
<text x="390.0" y="380.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">linearly: 10 mV per °C</text>
<text x="390.0" y="420.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">read it with an analog pin</text>
<rect x="525" y="52" width="240" height="400" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="645.0" y="82.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Digital IC (DS18B20)</text>
<linearGradient id="to92645" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a5568"/><stop offset="0.3" stop-color="#718096"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<ellipse cx="645" cy="234" rx="34" ry="6" fill="#000" fill-opacity="0.4"/>
<rect x="631" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="631" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<rect x="643" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="643" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<rect x="655" y="170" width="4" height="62" fill="#cbd5e0"/>
<rect x="655" y="170" width="1.5" height="62" fill="#ffffff" fill-opacity="0.6"/>
<path d="M621,172 L621,120 A24,10 0 0 1 669,120 L669,172 A24,10 0 0 1 621,172 Z" fill="url(#to92645)"/>
<ellipse cx="645" cy="120" rx="24" ry="10" fill="#2d3748"/>
<rect x="621" y="130" width="48" height="38" fill="url(#gloss)" opacity="0.5"/>
<text x="645.0" y="150.0" font-size="9" fill="#cbd5e0" text-anchor="middle" font-weight="bold">18B20</text>
<rect x="585" y="280" width="11" height="26" rx="2" fill="#f59e0b"/>
<rect x="600" y="300" width="11" height="6" rx="2" fill="#4a5568"/>
<rect x="615" y="280" width="11" height="26" rx="2" fill="#f59e0b"/>
<rect x="630" y="280" width="11" height="26" rx="2" fill="#f59e0b"/>
<rect x="645" y="300" width="11" height="6" rx="2" fill="#4a5568"/>
<rect x="660" y="280" width="11" height="26" rx="2" fill="#f59e0b"/>
<rect x="675" y="300" width="11" height="6" rx="2" fill="#4a5568"/>
<rect x="690" y="300" width="11" height="6" rx="2" fill="#4a5568"/>
<text x="645.0" y="325.0" font-size="11" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">a number, bit by bit</text>
<text x="645.0" y="360.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">the sensor does the maths</text>
<text x="645.0" y="380.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">and sends a number</text>
<text x="645.0" y="420.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">over a single data wire</text>
</svg>
