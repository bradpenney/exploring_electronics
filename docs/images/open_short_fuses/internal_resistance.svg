<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>An AA cell drawn as an ideal 1.5 volt source in series with its own internal resistance, shorted by a wire. With the datasheet's 150 to 300 milliohms of internal resistance, the short-circuit current is 5 to 10 amps.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><linearGradient id="cellv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9f6607"/><stop offset="0.22" stop-color="#f9c978"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#623f04"/></linearGradient><linearGradient id="resbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d7454"/><stop offset="0.22" stop-color="#ead5ba"/><stop offset="0.5" stop-color="#d9b382"/><stop offset="1" stop-color="#564734"/></linearGradient></defs>
<rect x="15" y="15" width="770" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="46.0" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="bold">A dead short isn't infinite current: the cell's own resistance limits it</text>
<rect x="140" y="100" width="120" height="220" rx="14" fill="url(#cellv)" opacity="0.35"/>
<rect x="140" y="100" width="120" height="220" rx="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
<rect x="186" y="86" width="28" height="14" rx="3" fill="#cbd5e0"/>
<text x="200.0" y="140.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">ideal 1.5 V</text>
<text x="200.0" y="156.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">source</text>
<rect x="154" y="225" width="92" height="28" rx="14" fill="url(#resbody)"/>
<text x="200.0" y="278.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">internal</text>
<text x="200.0" y="294.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">resistance</text>
<text x="200.0" y="345.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">an AA cell, opened up (in principle)</text>
<polyline points="200,86 200,70 360,70 360,360 200,360 200,320" fill="none" stroke="#3a1d0c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="200,86 200,70 360,70 360,360 200,360 200,320" fill="none" stroke="#b8673a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="200,86 200,70 360,70 360,360 200,360 200,320" fill="none" stroke="#ffd2b0" stroke-opacity="0.7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,-2)"/>
<text x="372.0" y="214.0" font-size="12" fill="#fc8181" text-anchor="start" font-weight="normal" font-style="italic">a wire straight</text>
<text x="372.0" y="230.0" font-size="12" fill="#fc8181" text-anchor="start" font-weight="normal" font-style="italic">across the cell</text>
<rect x="490" y="120" width="270" height="170" rx="12" fill="#1a1d23" stroke="#9ae6b4" stroke-opacity="0.5"/>
<text x="625.0" y="152.0" font-size="13" fill="#a0aec0" text-anchor="middle" font-weight="normal">Energizer AA datasheet:</text>
<text x="625.0" y="174.0" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="bold">150 to 300 mΩ internal</text>
<text x="625.0" y="210.0" font-size="15" fill="#9ae6b4" text-anchor="middle" font-weight="bold">I = 1.5 V ÷ 0.30 Ω = 5 A</text>
<text x="625.0" y="234.0" font-size="15" fill="#9ae6b4" text-anchor="middle" font-weight="bold">I = 1.5 V ÷ 0.15 Ω = 10 A</text>
<text x="625.0" y="268.0" font-size="12" fill="#fc8181" text-anchor="middle" font-weight="normal" font-style="italic">enough to make the wire and cell hot</text>
</svg>
