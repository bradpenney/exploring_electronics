<text x="435.0" y="345.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="bold">lamp dark</text>
<rect x="585" y="15" width="260" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="715.0" y="48.0" font-size="16" fill="#fc8181" text-anchor="middle" font-weight="bold">Short circuit</text>
<text x="715.0" y="68.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">a path that skips the load</text>
