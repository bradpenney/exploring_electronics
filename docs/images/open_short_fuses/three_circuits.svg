<polyline points="455,110 520,110 520,300 350,300 350,240" fill="none" stroke="#3a1d0c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="455,110 520,110 520,300 350,300 350,240" fill="none" stroke="#b8673a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="455,110 520,110 520,300 350,300 350,240" fill="none" stroke="#ffd2b0" stroke-opacity="0.7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,-2)"/>
