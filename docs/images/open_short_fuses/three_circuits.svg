<polyline points="630,175 630,110 800,110 800,300 630,300 630,240" fill="none" stroke="#b8673a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="630,175 630,110 800,110 800,300 630,300 630,240" fill="none" stroke="#ffd2b0" stroke-opacity="0.7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,-2)"/>
