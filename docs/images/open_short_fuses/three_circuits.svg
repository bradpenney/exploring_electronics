<rect x="305" y="15" width="260" height="370" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="435.0" y="48.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Open circuit</text>
<text x="435.0" y="68.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">a break anywhere: nothing flows</text>
<polyline points="350,175 350,110 415,110" fill="none" stroke="#3a1d0c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
