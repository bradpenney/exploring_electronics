<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>A graph of voltage against charge for a capacitor: a straight line from zero to 300 volts as 99 millicoulombs are stored. The shaded triangle under it is the stored energy, half of charge times voltage: 14.85 joules for a 330 microfarad flash capacitor at 300 volts.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="770" height="410" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="400.0" y="48.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Each extra coulomb is pushed in against a higher voltage</text>
<line x1="110" y1="100.0" x2="560" y2="100.0" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="104.0" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">300 V</text>
<line x1="110" y1="230.0" x2="560" y2="230.0" stroke="#4a5568" stroke-opacity="0.4"/>
<text x="102.0" y="234.0" font-size="11" fill="#a0aec0" text-anchor="end" font-weight="normal">150 V</text>
<line x1="110" y1="360" x2="560" y2="360" stroke="#a0aec0" stroke-width="1.5"/>
<line x1="110" y1="90" x2="110" y2="360" stroke="#a0aec0" stroke-width="1.5"/>
<text x="335.0" y="382.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal">charge stored (0 to 99 mC)</text>
<polygon points="110,360 560,100 560,360" fill="#f59e0b" fill-opacity="0.28"/>
<polyline points="110.0,360.0 560.0,100.0" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" filter="url(#softglow)"/>
<line x1="110" y1="230.0" x2="560" y2="230.0" stroke="#90cdf4" stroke-dasharray="6 5"/>
<text x="470.0" y="300.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">area = energy</text>
<text x="470.0" y="320.0" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold">= ½ × Q × V</text>
<text x="118.0" y="222.0" font-size="12" fill="#90cdf4" text-anchor="start" font-weight="normal">average: half the final voltage</text>
<text x="590.0" y="150.0" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="normal">330 µF at 300 V</text>
<text x="590.0" y="178.0" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="normal">Q = 99 mC</text>
<text x="590.0" y="206.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="normal">E = ½ C V²</text>
<text x="590.0" y="234.0" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="bold">  = 14.85 J</text>
<text x="590.0" y="280.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">a camera flash</text>
<text x="590.0" y="296.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">capacitor (Wikipedia,</text>
<text x="590.0" y="312.0" font-size="12" fill="#a0aec0" text-anchor="start" font-weight="normal" font-style="italic">"Flashtube")</text>
</svg>
