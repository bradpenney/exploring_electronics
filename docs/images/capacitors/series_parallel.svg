<polygon points="335.0,250.0 335.0,242.0 370.0,219.5 370.0,227.5" fill="#585f69"/>
<polygon points="225.0,162.0 335.0,162.0 370.0,139.5 260.0,139.5" fill="#bcc6d2"/>
<rect x="225.0" y="162.0" width="110.0" height="8.0" fill="#a0aec0"/>
<rect x="225.0" y="162.0" width="110.0" height="8.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="335.0,170.0 335.0,162.0 370.0,139.5 370.0,147.5" fill="#585f69"/>
<text x="295.0" y="122.0" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="normal">10 µF</text>
<text x="217.0" y="310.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">C = C₁ + C₂ = 20 µF</text>
<text x="217.0" y="334.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">like more plate</text>
<text x="642.0" y="48.0" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">Series: the gaps add</text>
<polygon points="585.0,122.0 695.0,122.0 730.0,99.5 620.0,99.5" fill="#bcc6d2"/>
<rect x="585.0" y="122.0" width="110.0" height="8.0" fill="#a0aec0"/>
<rect x="585.0" y="122.0" width="110.0" height="8.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="695.0,130.0 695.0,122.0 730.0,99.5 730.0,107.5" fill="#585f69"/>
<polygon points="585.0,187.0 695.0,187.0 730.0,164.5 620.0,164.5" fill="#9ba6b5"/>
<rect x="585.0" y="187.0" width="110.0" height="8.0" fill="#718096"/>
<rect x="585.0" y="187.0" width="110.0" height="8.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="695.0,195.0 695.0,187.0 730.0,164.5 730.0,172.5" fill="#3e4652"/>
<polygon points="585.0,252.0 695.0,252.0 730.0,229.5 620.0,229.5" fill="#bcc6d2"/>
<rect x="585.0" y="252.0" width="110.0" height="8.0" fill="#a0aec0"/>
<rect x="585.0" y="252.0" width="110.0" height="8.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="695.0,260.0 695.0,252.0 730.0,229.5 730.0,237.5" fill="#585f69"/>
<text x="745.0" y="150.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">10 µF</text>
<text x="745.0" y="192.0" font-size="11" fill="#a0aec0" text-anchor="start" font-weight="normal">shared</text>
<text x="745.0" y="215.0" font-size="13" fill="#e6e6e6" text-anchor="start" font-weight="normal">10 µF</text>
<text x="642.0" y="310.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">1/C = 1/C₁ + 1/C₂ → 5 µF</text>
<text x="642.0" y="334.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">like a wider gap; voltage ratings add</text>
</svg>
