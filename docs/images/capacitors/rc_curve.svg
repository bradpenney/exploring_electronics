<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Two curves against time measured in time constants. Charging rises steeply then levels off: 63.2 percent after one time constant, 86.5 after two, 95.0 after three, 98.2 after four and 99.3 after five. Discharging is the mirror image, falling to 36.8 percent after one time constant.</title>
