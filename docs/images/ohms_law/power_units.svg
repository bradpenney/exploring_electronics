<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Three 3D blocks: 9 volts, meaning 9 joules per coulomb, times 21.2 milliamps, meaning 0.0212 coulombs per second, equals 0.19 watts, meaning 0.19 joules per second.</title>
<defs><radialGradient id="eball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cbd5e0"/><stop offset="1" stop-color="#4a5568"/></radialGradient><radialGradient id="vball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff7e0"/><stop offset="0.45" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></radialGradient><radialGradient id="core" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#718096"/><stop offset="1" stop-color="#1a202c"/></radialGradient><radialGradient id="silverball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#c0c6cf"/><stop offset="1" stop-color="#5a6270"/></radialGradient><radialGradient id="copperball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd2b0"/><stop offset="0.45" stop-color="#c8733c"/><stop offset="1" stop-color="#5e2b10"/></radialGradient><radialGradient id="goldball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#e6b422"/><stop offset="1" stop-color="#7a5a00"/></radialGradient><radialGradient id="alball" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f0f6ff"/><stop offset="0.45" stop-color="#a8b8cc"/><stop offset="1" stop-color="#4a5868"/></radialGradient><radialGradient id="glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3748" stop-opacity="0.45"/><stop offset="1" stop-color="#1a202c" stop-opacity="0.15"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/></linearGradient><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect x="15" y="15" width="790" height="350" rx="14" fill="url(#panel)" stroke="#4a5568" stroke-opacity="0.6"/>
<text x="410.0" y="46.0" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="bold">Power is voltage times current, and the units say why</text>
<ellipse cx="144.0" cy="265.0" rx="115.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="35.0,110.0 225.0,110.0 253.0,92.0 63.0,92.0" fill="#f8bb54"/>
<rect x="35.0" y="110.0" width="190.0" height="150.0" fill="#f59e0b"/>
<rect x="35.0" y="110.0" width="190.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="225.0,260.0 225.0,110.0 253.0,92.0 253.0,242.0" fill="#865606"/>
<text x="130.0" y="160.0" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">9 V</text>
<text x="130.0" y="200.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">9 joules</text>
<text x="130.0" y="222.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">per coulomb</text>
<ellipse cx="424.0" cy="265.0" rx="115.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="315.0,110.0 505.0,110.0 533.0,92.0 343.0,92.0" fill="#6ea7dc"/>
<rect x="315.0" y="110.0" width="190.0" height="150.0" fill="#3182ce"/>
<rect x="315.0" y="110.0" width="190.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="505.0,260.0 505.0,110.0 533.0,92.0 533.0,242.0" fill="#1a4771"/>
<text x="410.0" y="160.0" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">21.2 mA</text>
<text x="410.0" y="200.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">0.0212 coulombs</text>
<text x="410.0" y="222.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">per second</text>
<ellipse cx="704.0" cy="265.0" rx="115.0" ry="7.2" fill="#000" fill-opacity="0.4"/>
<polygon points="595.0,110.0 785.0,110.0 813.0,92.0 623.0,92.0" fill="#6da98b"/>
<rect x="595.0" y="110.0" width="190.0" height="150.0" fill="#2f855a"/>
<rect x="595.0" y="110.0" width="190.0" height="150.0" fill="url(#gloss)" opacity="0.6"/>
<polygon points="785.0,260.0 785.0,110.0 813.0,92.0 813.0,242.0" fill="#194931"/>
<text x="690.0" y="160.0" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">0.19 W</text>
<text x="690.0" y="200.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">0.19 joules</text>
<text x="690.0" y="222.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">per second</text>
<text x="270.0" y="190.0" font-size="40" fill="#e6e6e6" text-anchor="middle" font-weight="bold">×</text>
<text x="550.0" y="190.0" font-size="40" fill="#e6e6e6" text-anchor="middle" font-weight="bold">=</text>
<text x="410.0" y="312.0" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold">the coulombs cancel: joules per coulomb × coulombs per second = joules per second = watts</text>
<text x="410.0" y="336.0" font-size="12" fill="#a0aec0" text-anchor="middle" font-weight="normal" font-style="italic">the LED loop from Voltage and Current: the battery delivers 0.19 W, all of it spent in the resistor and the LED</text>
</svg>
