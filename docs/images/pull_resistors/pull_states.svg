<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Four panels. Pull-down, button open: a 10 kilohm resistor ties the pin to ground and it rests LOW. Pull-down, pressed: the button connects the pin to 5 volts and it reads HIGH. Pull-up, button open: the resistor ties the pin to 5 volts and it rests HIGH. Pull-up, pressed: the button connects the pin to ground and it reads LOW.</title>
